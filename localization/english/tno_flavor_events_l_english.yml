 tno_ru_events.1.t: "Awaiting Orders"
 tno_ru_events.1.d: "The fog of chaos has cleared to give us a distinct opportunity to invade one of our neighbors.  We must now choose which neighbor to invade."
 tno_ru_events.1.f: "The Russian people have sludged through the past decade of constant warfare, from the war with Germany to the years of warlordism.  Today, this ends.  Our armies stand at the ready and the plans are drawn for the conquest of significant swaths of Russian territory.  Only once we have succeeded will the Russian people know peace."
