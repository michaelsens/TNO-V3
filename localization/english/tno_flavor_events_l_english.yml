 tno_RepIndia.2.t: "The Death of Jawaharlal Nehru"
 tno_RepIndia.2.d: "[SCOPE.sCharacter('is_jawaharlal_nehru').GetFullName], the Founding Father of the [SCOPE.sCountry('bht_nation_scope').GetNameNoFlag], has died."
 tno_RepIndia.2.f: "It was a cold and painful morning.  The military guardsmen stood quietly, sweat, resembling tears, dripping down their faces from mere hours performing exercises in preparation.  These men were determined to prove that Jawaharlal Nehru was not a man to be disrespected, that he was indeed worthy of the posthumous praise, the military honored state funeral, his will and testament followed to the letter, and the words of condolence and sympathy by various secretaries of states.\n\nTo some state officials, this would not be the end of Nehru's legacy.  They must fufill his will and testimony, not dissimilar to orders that need to be followed, as if nothing had changed at all.  Nehru's last will and testament echoed through the back of their minds:\n\n#italic "I want these to be carried high up into the air In an aeroplane and scattered from that height over the fields where the peasants of India toil, so that they might mingle with the dust and soil of India and become an indistinguishable part of India.""
 tno_RepIndia.2.1: "A legacy, enduring."
 tno_RepIndia.2.1.tt.1: "[SCOPE.sCharacter('is_jawaharlal_nehru').GetFullName] has died of a heart attack.  India's destiny now lies with his faithful disciple, [SCOPE.sCharacter('is_v_k_krishna_menon').GetFullName]."
 tno_RepIndia.2.1.tt.2: "[SCOPE.sCharacter('is_v_k_krishna_menon').GetFullName] becomes ruler in [SCOPE.sCountry('bht_nation_scope').GetName]"

 tno_RepIndia.3.t: "Mending the Twain"
 tno_RepIndia.3.d: "[SCOPE.sCharacter('is_v_k_krishna_menon').GetFullName] has announced a conference to discuss the economic reunification of the [SCOPE.sCountry('bht_nation_scope').GetName] and the [SCOPE.sCountry('bgl_nation_scope').GetName]."
 tno_RepIndia.3.f: "Vengalil Krishnan Krishna Menon stood before the various tables of representatives.  Scores of men, from both the INC and the HSS, reunited like a braided river.  Mere hours ago they would have considered eachother enemies, foreigners.  It was the byproduct of now over a decade of separation and disunity, the lasting legacy of Jawaharlal Nehru's failures.\n\nV.K. Krishna Menon hoped to right this wrong.  He fixed his tie, straightened his suit.  He hoped he could do the same for India.  He began his speech, so carefully prepared for this monumental moment in India's history.  The stakes could not be higher, not only his legacy but also his predecessor's legacy was at stake.  He and his representatives could not fail, lest the legacy of this event would be defined by failure and disappointment.\n\nA drop of sweat glided down his face, something hours of preparation and his exhibit of resolve couldn't prevent.  One more thought entered the back of his mind, to caulk any percieved cracks in his window of confidence."
 tno_RepIndia.3.1: "The stakes are too high to fail."
 tno_RepIndia.3.1.tt.1: "The #bold Lucknow Conference#! has begun.  We will have one opportunity to convince representatives of the [SCOPE.sCountry('bgl_nation_scope').GetName] that #white economic reunification#! is within their interests.\n\n#bold  If the conference succeeds, this will be the first step to the peaceful reunification of India."
 tno_RepIndia.3.1.tt.2: "Adds #bold The Lucknow Conference#! to the Journal of #bold [SCOPE.sCountry('bht_nation_scope').GetNameNoFlag]#!"

 tno_azadhind.1.t: "On the Brink"
 tno_azadhind.1.d: "Despite multiple years of economic investments and the equivalent of millions of USD spent, Kolkata is on the brink of economic collapse."
 tno_azadhind.1.f: ""That's the last of it," one of Subhas Chandra Bose' economic advisors said.  Bose knew what his advisor meant, though it was not said.  There was nothing left to give.  Despite their best efforts, the equivalent of millions of USD of economic investments to modernize Kolkata, Kolkata would not be brought up by its bootstraps, and it fell further into poverty.  What was envisioned as the magnum opus of Bose' economic vision was now to be the evidence of his failures.\n\nBose knew the warning signs.  The crash of Yasuda did not occur in a vacuum, the consequences of careful dependence on the Japanese market eventually had to rear their ugly heads.  He once hoped to play both sides, leveraging the benefits of prudent Japanese reliance to modernize India, but that was behind him now.  He could only stand and see the aftermath of his failed projects and programs, their only legacy being on a spreadsheet." 
 tno_azadhind.1.1: "Drastic action must be taken."
 tno_azadhind.1.1.tt.1: "We will soon be approached by the [SCOPE.sCountry('bht_nation_scope').GetNameNoFlag] government about the potential #white reunification of the Indian economies.#!\n\n#bold This could be the first step in the peaceful reunification of India."

 tno_azadhind.2.t: "Attending the Conference"
 tno_azadhind.2.d: "With our options run dry, we have decided to attend the #white Lucknow Conference#! on the potential #white economic reunification#! of India."
 tno_azadhind.2.f: ""Together we will create a truly independent India, free from Western and Japanese interests, where Indian interests are put first", echoed V.K. Krishna Menon from the other side of the room.  Hundreds of plates lined the tables, the sounds of clinking and clattering filling what was left of the room from the intense chatter. Every seat assigned, every representative predestined to meet representatives from the opposite party.  Every detail had been accounted for, from waiters and waittresses at the ready to top-of-the-line chefs being imported from around India, all to give a veneer of trust and care.  This was V.K. Krishna Menon's gambit, and he would do everything to make sure it succeeded.\n\nThere must have been a million voices in those rooms.  The echoes of representatives from the two countries, united by table but divided by political party.  Normally, such a congregation would be stormed by police, every member of this meeting arrested.  In any other context, members of the HSS setting foot in this building, or INC members mingling with HSS members would be a criminal offense."   
 tno_azadhind.2.1: "Truly an unusual sight."
 tno_azadhind.2.1.tt.1: "The #bold Lucknow Conference#! has begun.  We will have one opportunity to convince representatives of the [SCOPE.sCountry('bht_nation_scope').GetName] that #white economic reunification#! is within their interests.\n\n#bold  If the conference succeeds, this will be the first step to the peaceful reunification of India."
 tno_azadhind.2.1.tt.2: "Adds #bold The Lucknow Conference#! to the Journal of #bold [SCOPE.sCountry('bgl_nation_scope').GetNameNoFlag]#!"

 tno_lucknow.1.t: "Unlucky Circumstances"
 tno_lucknow.1.d: "An unexpected border skirmish has left 21 dead near a small town named Sheikhpura.  The Indian government has claimed the soldiers were patrolling a familiar border region before they were unexpectedly fired upon."
 tno_lucknow.1.f: "(13:14) "#BSF One-One, this is Sector 4, we've seemed to found some sort of movement in the valley.  Doesn't look like the normal set of refugees."\n(13:14) "Acknowledged, Sector 4.  Approach and arrest them."\n(13:16) "This is Sector 4.  I'm seeing something that resembles some sort of firearm.  Something doesn't feel right."\n(13:17) "Sector 4, you are to approach immediately."\n(13:22) "This is Sector 4.  Requesting backup.  Contact from the top of the valley."\n(13:26) "More hostiles on the high ground above our position.  Multiple targets, high ground.  Multiple casualties.  Requesting backup now."\n (13:27) "Maintain cover.  Command needs the number of hostiles."\n (13:28) "20, confirmed.  No, 30.  More coming from the ridge, even more casualties.""
 tno_lucknow.1.1: "Sector 4, where are you?  We can't seem to find you."

 tno_lucknow.2.t: "That Man at the Table"
 tno_lucknow.2.d: "The #light_green Opening Talks#! of the #gold Lucknow Conference#! have completed."
 tno_lucknow.2.f: ""I've got an assignment for you," V.K. Krishna Menon said to Natwar Singh while stirring his cup of tea.  "You've gotta tell me more about London.  I wonder how much it's changed, look how much India has changed," Singh said, jokingly trying to change the subject.  The two men silently expressed their stress about the height of the current situation.\n\n"I need your help, Natwar.  You know these things better than I do, I need you to talk to Rash Bose."  Immediately Natwar looked to the right, staring direclty at Bose.  Bose was sitting quietly yet sternly in his cushioned black chair, his hands resting gently on the wooden table.  While Bose's cohorts were engaging with the other men at the table, Bose himself offered an almost eerie silence.\n\n"I see him.  Who is he, anyway?  Doesn't seem like the open book type."  Menon sighed for a moment before saying, "Think of him like Subhas Bose's best friend.  I know you'll figure something out, Natwar.""
 tno_lucknow.2.1: "This is gonna be a long ride."
 tno_lucknow.2.1.1: "The #gold Conference#! will now enter the #light_green HSS Negotation#! phase about the future of Azad Hind political parties."

 tno_lucknow.3.t: "Leaving a Good Impression"
 tno_lucknow.3.d: "The #light_green HSS Negotations#! phase of the #gold Lucknow Conference#! has completed."
 tno_lucknow.3.f: ""With the signing of this document, the HSS will no longer be banned in the Republic of India," V.K. Krishna Menon said in his usual sharp, fiery voice when speaking to a crowd.  The speech ended with a thunder of applause across the room.  Menon bat his eye to Natwar Singh, now sitting at the table with Rash Bashari Bose.  Within that second-long glance, Krishna Menon knew that Singh was doing his magic.\n\nWhen the speech was over, Krishna Menon stepped down from the stage.  If this was the jungle of diplomacy, Singh would have to be his Tarzan, and they needed to swing from problem to problem without losing grip.  Rash Bose walked towards Menon, almost arm in arm with Natwar Singh.  Menon knew he had to make a lasting impression.\n\n"You've really done it now, Krishna.  I had my doubts about you, but maybe this thing really is possible.  I'll put a good word in for Subhas Bose,"  Rash Bose said before walking out of the building, bouyantly entering his all-black Toyota Crown.  Menon watched with passing glances before the building's door closed and all Menon could see was the blank surface of the door."
 tno_lucknow.3.1: "The conference escalates."
 tno_lucknow.3.1.1: "The #gold Conference#! will now enter the #light_green Economic Integration#! phase about further tying the two India's economies together."
 tno_lucknow.3.1.2: "The #b HSS#!, the ruling party of the [SCOPE.sCountry('bgl_nation_scope').GetNameNoFlag], is no longer banned in the [SCOPE.sCountry('bht_nation_scope').GetNameNoFlag]."

 tno_lucknow.4.t: "A Little Push"
 tno_lucknow.4.d: "The #light_green Economic Integration#! phase of the #gold Lucknow Conference#! has completed."
 tno_lucknow.4.f: ""What happened to Subhas Bose?  I was looking forward to meeting the man," Natwar Singh said to V.K. Krishna Menon.  Menon wanted to answer him but he didn't know the answer himself.  "I guess we'll have to see if he ever shows up," he said in an almost disappointed tone.\n\n"Kind of funny.  This whole conference could change India for the better and he doesn't even have the decency to show up to it," Natwar said to Singh as the businessman who was walking towards the men overheard.  "All this talk about bridges and reconnecting railways, when are we gonna talk about the bottom line?  No investor wants to build all of these vanity projects unless he knows it's for something.  We need some kind of assurance, something concrete," The businessman advised Menon.\n\nMenon had just gotten through 3 long days of 'finalizations', constant meetings and a parade of paperwork.  Mustering his strength, he tapped on a glass until the room stood quiet.  Menon started by directing his speech to the few yet powerful investors in the room.  "The conference is off the ground.  We have only a little ways to go—then we will begin talks about a unified market."  Menon said this while holding his breath.  Menon spoke of reaching the summit of a mountain, though the conference seemed as if it was still in the foothills."
 tno_lucknow.4.1: "Time to make this a reality, Subhas Bose or not."
 tno_lucknow.4.1.1: "The #gold Conference#! will now enter the #light_green Unified Market#! phase about finalizing the total unification of the Indian markets."

 tno_lucknow.5.t: "A Meeting of Old Friends, Pt. 1"
 tno_lucknow.5.d: "The #light_green Market Unification#! phase of the #gold Lucknow Conference#! has completed."
 tno_lucknow.5.f: "V.K. Krishna Menon was sitting legs crossed at one of the tables, passively sipping another cup of tea, when one of his aides tapped him on the shoulder.  "Have you spoken to Subhas Bose?" The aide asked, almost in an assuming tone.  "I've spoken to him on the phone, but not in many years.  What do you mean?"  Menon almost jumped when he heard that Subhas Bose was at the conference and he wasn't there to welcome him.\n\nJust as divers close their hands when entering the water, Menon sliced through the crowd to look for Subhas Bose.  When he finally caught up with him, he eloquently explained, "It's been years, old friend.  I invited you to Nawaharlal's funeral, but I didn't expect you to not show up."\n\n"You know why I couldn't show.  That's why I'm here now," said Subhas Bose, almost acting upset over having to miss his best friend's funeral.  "Come, have a seat,"  Menon said to Subhas Bose, hastily grabbing a chair from another table for him to sit in."
 tno_lucknow.5.1: "We've got a lot to talk about."
 tno_lucknow.5.1.1: "We will now attempt to bring the #gold Conference#! into it's final stage: #light_green Total Reunification#!."

 tno_lucknow.6.t: "A Meeting of Old Friends, Pt. 2"
 tno_lucknow.6.d: "The #gold Lucknow Conference#! has been completed.  India will soon be reunited."
 tno_lucknow.6.f: "V. K. Krishna Menon and Subhas Chandra Bose sat next to eachother at the table.  Sitting opposite from them was an empty seat labeled 'JAPANESE AMBASSADOR'.  Krishna Menon and Subhas Bose caught up not on government politics or diplomacy, but instead on old memories, their time before poltics, and inevitably their shared old best friend Nawaharlal Nehru.\n\nNatwar Singh was looking for Krishna Menon.  He wasn't at his normal seat, it took him a good few minutes of searching through the crowd, at the tea kettle, and near the stage, before he finally found him where he least expected him: next to Subhas Bose himself.\n\n"Hello gentlemen, it seems you two are getting along nicely," Natwar said as he sat in the seat across from them, knowing the man who was supposed to be sitting here had been absent the entire conference.  "Subhas, I'd like you to meet a good friend and diplomat of mine, Natwar Singh." "Yes, Rash Bose has already told me everything about you.  It seems you've made quite an impression."\n\nSubhas Bose then went on about the inner circle of the HSS, before Menon interrupted about the conference.  Subhas Bose quickly admitted, "I've had my demands all along.  Don't worry about this market unification, if you can meet these underlined demands here I will personally see to it that the Eastern provinces are ceded directly to your government,"  Subhas said before crossing out two of the demands on the list."
 tno_lucknow.6.1: "And thus a friendship was born."

 tno_lucknow.8.t: "Troubled Water"
 tno_lucknow.8.d: "The most recent attempt to advance the #gold Lucknow Conference#! has #r failed.#!  This could be due to a low #g @green_checkmark! Acceptance Chance#!."
 tno_lucknow.8.f: ""This isn't working," V.K. Krishna Menon said to Natwar Singh.  "There's got to be be something we can do."  Menon realized he wasn't just asking Singh, he was asking himself the same question.  And neither of them had an answer.\n\nMenon, deciding to claw away some progress, asked the ambassador next to him what was the problem.  "Well you see, there's this fishing village off the coast of Madras..." The ambassador nearly bored Menon to death with the fine details of this worthless dispute on some technicality.\n\nMenon decided to take action.  Emulating his fiery speech in New Delhi, Menon urged that the conference needed to "get back on track", whatever that meant.  Menon hoped it did something, it seemed to ease at least a fraction of the burden off the tired faces of many of the men in the room."
 tno_lucknow.8.1: "Let's start back from the top."
 tno_lucknow.8.1.1: "We only recieve a #bold limited amount of tries#! to advance the #gold Conference.#!  If we run out of tries, the #gold Conference#! will #r fail.#!"

 tno_lucknow.9.t: "No Quarter"
 tno_lucknow.9.d: "The diplomats of the [SCOPE.sCountry('bgl_nation_scope').GetNameNoFlag] walk out in frustration.  The #gold Lucknow Conference#! has failed."
 tno_lucknow.9.f: ""Where are they going?" Natwar Singh worriedly asked V.K. Krishna Menon.  "This can't be happening.  I've risked everything for this conference," Menon said to the air, ignoring Natwar's question.  The room, once filled with the voices of chatter, was now filled with the emptiness that Menon now felt.\n\n"Krishna, this wasn't your fault.  I messed up too, and everyone here.  Maybe it just wasn't meant to be," said Natwar.  Menon continued to ignore him.  "I have failed India and I have failed you."  Singh quickly fired back, "You haven't failed India.  You faced the dogs of British media, fighting for Indian independence.  You've always put your work first.  Instead of marrying a woman, you've practically married public service!"\n\nMenon waited for a few moments before delivering his next line."
 tno_lucknow.9.1: "I am resigning from my position of Prime Minister tomorrow."
 tno_lucknow.9.1.1: "[SCOPE.sCharacter('is_v_k_krishna_menon').GetFullName] will resign in shame."
 tno_lucknow.12.1: "The #R @tension! Tension#! of the #gold Conference#! reached too far above the boiling point.  The subsequent assassination attempt on #yellow Subhas Chandra Bose#! has ended any hopes of peaceful Indian reunification."
 tno_lucknow.12.2: "\n"
 tno_lucknow_debug: ""

 tno_lucknow.13.t: "Two Boses, Two Singhs"
 tno_lucknow.13.f: ""Where's Bose?"  Mohan Singh asked Rash Behari Bose.  Bose scooted his chair closer to the table, and lessened his stern composture for just a moment.  "He said something about not coming." he calmy replied.  Both men knew that Bose was really trying to send a message, or he was trying to say something about how dangerous it is.  Either way, Rash Bose and Mohan Singh felt like square pegs in a round hole.\n\nThe two military men continued to sit in silence until a tall, wide-shouldered man brushed his way to their table.  "Rash Bose?  My name is Natwar Singh." the man said as he borrowed a seat.  "I've heard a lot about you.  You know, we have a lot more in common than one might think.  Both of us being diplomats and all." the man said, clearly trying his hardest to force a conversation."
 tno_lucknow.13.1: "This is gonna be a long day."

 tno_lucknow.14.t: "A Parting Remark"
 tno_lucknow.14.f: ""With the signing of this document, the HSS will no longer be banned in the Republic of India," V.K. Krishna Menon said on the other side of the room.  But to Rash Bose and Natwar Singh, it was really background noise to their joyful conversation.  "I ought to visit Japan again.  Tell me, what is this instant ramen I keep hearing about?" Singh delightfully asked Bose.  What started as a book with blank pages eventually became a vibrant conversation, and a new friend for Rash Bose.  As for Natwar Singh, he was just happy he had a chance to make a good impression.\n\nMohan Singh stayed silent at the table, awkardly slumping in his leather chair.  Searching the room for something to do besides 'get tea again', he saw V.K. Krishna Menon approaching the group.\n\n"You've really done it now, Krishna.  I had my doubts about you, but maybe this thing really is possible.  I'll put a good word in for Subhas Bose,"  Rash Bose said before getting up out of his chair.  Mohan Singh took the opportunity to escort Rash outside to the Bose's all-black Toyota Crown.  As they settled in their seats, Mohan Singh asked, "What are we going to tell Bose?"" 
 tno_lucknow.14.1: "I'm going to get Bose to attend the conference."

 tno_lucknow.15.t: "Convincing Netaji"
 tno_lucknow.15.f: "Subhas Chandra Bose got up from his chair to meet Rash Behari Bose as he entered the room.  "I'll talk to you about this later, my Netaji." said Subhas Bose's aide before leaving.  "Subhas, I have great news.  First of all, the Lucknow Conference really is getting off the ground." Rash Bose said to Subhas Bose.\n\nSubhas Bose stared at Rash intently for a moment before sitting back down in his chair.  "Rash, how does this help me?  I don't see a reason to go."  Rash Bose responded immediately with, "Netaji, old friend, this is our opportunity.  You need to see the West for yourself, it isn't that much worse than you think it'd be compared to here."  Rash waited a moment.  "Only about one or two extra potholes than on our roads," Rash jokingly yet daringly said to one of his best friends yet also superior.  "I'll go, but you're coming with.  Get Naraj to get my security detail," Subhas said."
 tno_lucknow.15.1: "There's so much I need to tell you about when we get to the car."

 tno_lucknow.16.t: "A Meeting of Old Friends, Pt. 1"
 tno_lucknow.16.f: ""Quite the welcome for the most important person at this meeting," Subhas Chandra Bose sarcastically remarked.  With him was Mohan Singh and Rash Behari Bose as well as an oversized security detail.\n\nAfter continuing their way inside, Bose was greeted by his own ambassadors and diplomats almost as much as he was by the Western Indian ones.  Bose and his entourage continued to stand, waiting for someone to finally show them the decency of offering Bose a seat.\n\nBose continued to search the room until he saw V.K. Krishna Menon searching for someone in the crowd.  It'd been years since Bose himself had seen Krishna in the flesh, the last time was when Jawaharlal Nehru had still been alive.  Nehru, who Bose greatly wished he could have attended the funeral of but couldn't due to security concerns, happened to be Krishna and Boses's mutual best friend. Krishna finally caught up with them.  "It's been years, old friend.  I invited you to Nawaharlal's funeral, but I didn't expect you to not show up."\n\n"You know why I couldn't show.  That's why I'm here now," said Subhas Bose, almost acting upset over having to miss his best friend's funeral.  "Come, have a seat,"  Menon said to Subhas Bose, hastily grabbing a chair from another table for him to sit in." 
 tno_lucknow.16.1: "This ought to be good."

 tno_lucknow.17.t: "A Meeting of Old Friends, Pt. 2"
 tno_lucknow.17.f: "V. K. Krishna Menon and Subhas Chandra Bose sat next to eachother at the table.  Sitting opposite from them was an empty seat labeled 'JAPANESE AMBASSADOR'.  Krishna Menon and Subhas Bose caught up not on government politics or diplomacy, but instead on old memories, their time before poltics, and inevitably their shared old best friend Nawaharlal Nehru.\n\nSuddenly, Natwar Singh, after searching for a while, finally found Krishna Menon with none other than Subhas Bose.  "Hello gentlemen, it seems you two are getting along nicely," Natwar said as he sat in the seat across from them, knowing the man who was supposed to be sitting here had been absent the entire conference.  "Subhas, I'd like you to meet a good friend and diplomat of mine, Natwar Singh." "Yes, Rash Bose has already told me everything about you.  It seems you've made quite an impression."\n\nSubhas Bose then went on about the inner circle of the HSS, before Menon interrupted about the conference.  Subhas Bose quickly admitted, "I've had my demands all along.  Don't worry about this market unification, if you can meet these underlined demands here I will personally see to it that the Eastern provinces are ceded directly to your government,"  Subhas said before crossing out two of the demands on the list." 
 tno_lucknow.17.1: "And thus a friendship was born."

 tno_lucknow.20.t: "Movements on the Border"
 tno_lucknow.20.d: "Our border guards have detected significant troop movements on our border with the [SCOPE.sCountry('bgl_nation_scope').GetName]." 
 tno_lucknow.20.f: "[SCOPE.sCharacter('bht_ruler').GetFullNameNoFormatting] sat in [SCOPE.sCharacter('bht_ruler').GetHerHis] office, discreetly playing with [SCOPE.sCharacter('bht_ruler').GetHerHis] pens, thinking of the heightened tensions with the East.  [SCOPE.sCharacter('bht_ruler').GetLastNameNoFormatting] was at the Lucknow Conference, [SCOPE.sCharacter('bht_ruler').GetSheHe] remembered how it started off with good intensions but quickly tumbled back into apathy and eventually hatred.  Just as [SCOPE.sCharacter('bht_ruler').GetSheHe] remembered the sheer hopelessness [SCOPE.sCharacter('bht_ruler').GetSheHe] caught in Krishna Menon's eyes in the later point of the conference, an aide knocked on the door.\n\n"Come in," [SCOPE.sCharacter('bht_ruler').GetLastNameNoFormatting] said.  The aide quickly explained the situation, the worrying troop movements on the Eastern border, as if they were preparing for war.  [SCOPE.sCharacter('bht_ruler').GetLastNameNoFormatting] waited for a moment, staring at the drop of sweat on the aide's brow.  A moment after collecting [SCOPE.sCharacter('bht_ruler').GetHerselfHimself], [SCOPE.sCharacter('bht_ruler').GetSheHe] quickly bounced back to say," 
 tno_lucknow.20.1: "I'll need to speak with the defence minister."
 tno_lucknow.20.1.1: "#R [SCOPE.sCountry('bgl_nation_scope').GetName] is preparing for war against us.  They will soon attack.#!"
 tno_lucknow.20.1.2: "#lore [SCOPE.sCountry('bgl_nation_scope').GetName] will not recieve immediate help from the Sphere.  We will have a small window when there is little foreign intervention, before we are forced to rely on the United States.#!"
 tno_lucknow.20.1.3: "#bold #yellow The Pakistanis will likely use this as an opportunity to attack us.#!"

 tno_lucknow.21.t: "Almost There"
 tno_lucknow.21.d: "Our military has urged us that it is ready for the liberation of the rest of India.  We will attack in #R 60 days.#!" 
 tno_lucknow.21.f: "It was 11:30.  Only a couple more hours left in the day, [SCOPE.sCharacter('bgl_ruler').GetFullNameNoFormatting] supposed.  [SCOPE.sCharacter('bgl_ruler').GetLastNameNoFormatting] sat in front of multiple large stacks of papers, for a total of what must be over 200 various reports, requests, and other information that he now had to look through.  Sighing, he got to work.  Shortly after glooming through the report about the diplomatic situation with the Bhutanese, [SCOPE.sCharacter('bgl_ruler').GetLastNameNoFormatting] was happy to read the next report's title: "A MESSAGE", it began, "FROM GENERAL KIANI".\n\n"Finally, something interesting," [SCOPE.sCharacter('bgl_ruler').GetLastNameNoFormatting] thought to [SCOPE.sCharacter('bht_ruler').GetHerselfHimself].  After a short minute of reading, [SCOPE.sCharacter('bgl_ruler').GetLastNameNoFormatting] learned that the military preparations had finally completed, almost on schedule.  The Imperialist Western government, who betrayed him in his time of need, will finally face true justice for their crimes.  [SCOPE.sCharacter('bgl_ruler').GetLastNameNoFormatting] noticed a small photo of a line of tanks underneath a folder, in full color too.  "Yes," he thought," 
 tno_lucknow.21.1: "Exactly as I had requested."
 tno_lucknow.21.1.1: "#bold We will attack the [SCOPE.sCountry('bht_nation_scope').GetName] in #R 60 days.#!"

 tno_lucknow.22.t: "The Time Has Come"
 tno_lucknow.22.d: "The two Indias have been plunged into war." 
 tno_lucknow.22.f: ""WAR IN INDIA," the latest publication of the New York Times read.  Hundreds of other publications read similar messages, but for the Indians, they could not retreat back into their air-conditioned offices.  Across the subcontinent, lives were being dug up from the root and thrown around.  On the frontlines, the soldiers of the Free Indian government and the INC government battled not just for the defence of their country, but the defence of their ideals." 
 tno_lucknow.22.1: "There's no going back now."
 tno_lucknow.22.1.1: "#bold #R The war against our rival government on the subcontinent has begun.#!"
 
 tno_lucknow.23.t: "Movements in the West"
 tno_lucknow.23.d: "The [SCOPE.sCountry('pak_nation_scope').GetName] has invaded us from the West." 
 tno_lucknow.23.f: "The men of the Indian intelligence had a certain dumbfounded look on their face.  "How could you let this happen?" [SCOPE.sCharacter('bht_ruler').GetFullNameNoFormatting] barked back at them.  "I tried to warn you, but you were too focused on the war in the East.  I decided it wasn't important, at the time we thought the Pakistan Movement's forces were no threat at all," one of the men of the Intelligence service said in a heavily forced attempt to appear respectful.  [SCOPE.sCharacter('bht_ruler').GetLastNameNoFormatting] took a moment to step towards the man.\n\n"What's your name?" [SCOPE.sCharacter('bht_ruler').GetLastNameNoFormatting] asked, holding back the tsunami of anger. "Vivek."  [SCOPE.sCharacter('bht_ruler').GetLastNameNoFormatting] replied swiftly," 
 tno_lucknow.23.1: "I want you to tell me about what other movements you deem to be supposedly 'are no threat at all.'"
 tno_lucknow.23.1.1: "#bold #R The [SCOPE.sCountry('pak_nation_scope').GetName] has begun invading us from the West.#!"




























tno_cammroon.1.t: "Focus on France or Germany?"
tno_cammroon.1.d: "The time has come to decide the future of Africa. We can choose to either focus our forces on the French imperialists or the genocidal Germans."
tno_cammroon.1.f: "Cameroon lies in a sea of anarchy and destruction. From Zentralafrika in the southeast to Yorubaland in the West, with rebellious groups thriving in between, Cameroon's borders are anything but secure. Efforts to secure the wild border are proving too big a drain on manpower and the economy, but the border must be secure for Cameroon to survive. If the situation is not handled soon, the country is sure to collapse."
tno_cammroon.1.1: "Focus on France"
tno_cammroon.1.1.tt.1: "We will focus our efforts on fighting the French. We will deal with the Germans later. After dealing with France we will deal with German, Italian, and Iberian Africa."
tno_cammroon.1.2: "Focus on Germany"
tno_cammroon.1.1.tt.2: "We will focus on destroying German Africa. After we finish off the Germans we will focus on destroying Italian and Iberian Africa."
tno_cammroon.1.1.tt.3: "This will weaken our efforts when it comes to fighting the French."
tno_cammroon.2.t: "The Traitors"
tno_cammroon.2.d: "The time has come to put down the western rebels. Our nation will be unified!"
tno_cammroon.2.f: "Opportunistic officers revolted during our invasion of Zentralafrika. We were not able to put the rebbellion down due to the war. The bombing has futher slowed down our recapture of these lands."
tno_cammroon.2.1: "A long overdue liberation"
tno_cammroon.3.t: "A New Zentralafrika Crisis."
tno_cammroon.3.d: "The time has come for German Africa to come to an end. The decades of imperialism and genocide will be ended. "
tno_cammroon.3.1: "Onwards into Zentralafrika!"
tno_cammroon.3.f: "The ACA's shining moments were during the Zentralafrika Crisis back in the 1950s, when it proved itself a powerful fighting force. During the crisis, however, the ACA was obliterated by the Luftwaffe. It is time for us to get our revenge and free Africa!"
tno_cammroon.4.t: "A New Zentralafrika Crisis."
tno_cammroon.4.d: "Cameroon has claimed large parts of Zentralafrika. It seems they are trying to end German Africa."
tno_cammroon.4.f: "We shattered their failed West African Union during the Zentralafrika crisis. They now seem to be trying again. Last time we fought we achieved a swift victory. There is nothing to be worried about as long as nothing crazy happens."
tno_cammroon.4.1: "Delusional fools."
tno_cammroon.5.t: "Kicking Italy Out Of Africa"
tno_cammroon.5.d: "The time has come to kick Italy out of Africa. This content is currently unfinished! Thank you for getting this far, More content to come with the west african update."
tno_cammroon.5.f: "Yippie"
tno_cammroon.5.1: "Bad mod"
