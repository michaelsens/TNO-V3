 tno_italy_events.1: "Our future"
 tno_italy_events.1.d: ""

 tno_italy_events.1.f: "The grand dreams of colonialism and an imperial Italy seemed so close to becoming reality. In the aftermath of the Second World War, the tricolour waved over the defeated British forts, as the victorious Regio Esercito advanced in the Middle East - after Egypt, Palestine soon fell, as the British lion bled under the talons of the Italian eagle. When Italian troops entered Jerusalem, Rome's propaganda took no time to paint the triumph as the mighty echo of an ancient past - the glorious legions, that had once brought order and peace to Judea under Vespasian and Trajan, have now returned to Palestine led by Benito Mussolini, the Caesar of our age.\n\nOf course, reality was much different, and its taste much more bitter. Native resistance to Italian occupation was strong, and the more the Italian Empire spread far and wide on the map, the more its forces were stretched thin on the ground. Fascist plans to turn the Levant into a loyal and Italian province of the Empire by assimilating the natives were soon canned, as opposition to Italy was one of the few things capable of uniting the various ethnic, religious and cultural groups in the region. Projects to resettle the Levant with Italians never left the drawing board, as the people of the peninsula preferred the much safer lands of the Fourth Shore, and after years of endless cycles of revolt and repression, the new Duce, Galeazzo Ciano, in his bid to resolve the many ailments of the Empire, finally decided that a new course of action was necessary. \n\nOur governor agreeing to allow autonomy and a moderate level of freedom to those who were content with that, and focusing the efforts of his garrison on the more radical paramilitaries and resistance groups. An uneasy peace was built in the Levant - a fickle, fragile truce, built to protect the many innocent civilians of the region, whatever their religion or ethnicity, from the horrors of what could very well be an endless, subterranean war"
 tno_germany_events.45.t: "Establish Reichskommissariat Scandi?"
 tno_germany_events.45.d: "Now that Sweden and Norway are ounder our control we may unite them into a unified Scandinavian Reichskommissariat. IF we choose to do so of course.  "
 tno_germany_events.45.f: ""
 tno_germany_events.45.a: "Unite Sweden and Norway!"
 tno_germany_events.45.b: "The status quo suits us."
 
