  tno_germany_events.42.t: "The Pakt, Reclaimed"
  tno_germany_events.42.d: "After a monumental loyalty contest between us and our subjects, and the traitors to our rule now defined, we have finally defeated the traitors and re-established our rule over the Einheitspakt."
  tno_germany_events.42.f: "At the onset of our civil strife, the various subject states that we ruled over faced civil strife of their own.  Described as a 'great loyalty test' by Führer [SCOPE.sCharacter('ger_leader').GetFullNameNoFormatting], many of our former subject states managed to prolong German rule in their regions, despite rebel activity.  However, subjects like Ostland and Ukraine were not so lucky.\n\nDespite these significant setbacks, and the tremendous task of reconstruction following our civil war, we have managed to re-establish our rule over all former territories.  The thousands of German colonial families who will proudly inherit these regions have only us to thank for perpetuating their existence."
  tno_germany_events.42.a: "Generations of German Children, Saved"

  tno_germany_events.43.t: "The Second West Russian War"
  tno_germany_events.43.d: "Führer [SCOPE.sCharacter('ger_leader').GetFullNameNoFormatting] had spent the long hours of the day drooping over his desk, studying the slave situation in the West and the latest developments about the mysterious state of Burgundy.  "
  tno_germany_events.43.f: "[SCOPE.sCharacter('ger_leader').GetLastNameNoFormatting] found his eyes practically glued to the papers he was glossing over, when the door slung open without warning.  Without spending the energy to glance up at Colonel von Müller, [SCOPE.sCharacter('ger_leader').GetFullNameNoFormatting] ushered him out the door with a simple, "This is not the time for interruptions, Colonel. I am busy."\n\nVon Müller, undeterred, entered the room with urgency. "Mein Führer, I apologize for the interruption, but urgent news has just reached us. You need to hear this."  The Führer, attempting to dismiss the interruption, gestured toward the door. "Whatever it is, it can wait. I will not be disturbed."\n\nWithout hesitation, von Müller explained the situation in the East, of the invasion force that weeks ago was merely far-off rumors.  After mere moments that seemed like hours, [SCOPE.sCharacter('ger_leader').GetLastNameNoFormatting] declared "We have weathered storms before, Colonel," clearly a line he had prepared for a speech sometime in the future.  [SCOPE.sCharacter('ger_leader').GetLastNameNoFormatting] continued, "The Russians may be mobilizing, but they cannot truly stand up to the might of the German war machine."  It was clear that [SCOPE.sCharacter('ger_leader').GetLastNameNoFormatting] knew the gravity of the situation, somewhere in the back of his mind.  Although he would deny it, the fate of the Reich now hung in the balance."
  tno_germany_events.43.a: "Time to dust off the plans for Fall Rot."
  tno_germany_events.43.a.tt: "#lore The [SCOPE.sCountry('rus_nation_scope').GetName] has begun preparations for a full-scale invasion of our Eastern territories.  We will not give in, but we must be prepared for the inevitable struggle ahead.  The following months will determine the fate of the Reich."

