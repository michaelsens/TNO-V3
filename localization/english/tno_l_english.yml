  # TECH
  tooling_workshops: "Tooling Workshops"
  logging: "Logging"
  logging_desc: "Basic logging represents the organized harvesting of forests using traditional hand tools and simple labor. This technology establishes the foundation of the timber industry, enabling rudimentary sawmills and early economic exploitation of woodlands."
  logging_1: "Improved Logging"
  logging_1_desc: "Advances in gasoline-powered equipment and transportation revolutionize the industry. Portable saws, tractors, and early logging trucks reduce manual labor and increase output, bringing deep forests within economic reach."
  logging_2: " Mechanized Logging"
  logging_2_desc: "The age of axes and handsaws is over. By mechanizing logging operations with chainsaws, tractors, and rudimentary logging trucks, nations can significantly boost timber production while reducing labor intensity. This technology lays the groundwork for an industrial forestry sector."
  logging_3: "Hydraulic Logging Systems"
  logging_3_desc: "Hydraulic skidders and feller-bunchers revolutionize timber harvesting, allowing faster, more efficient felling and extraction of trees. These machines minimize downtime and increase the scale of forest exploitation, especially in rugged terrains."
  logging_4: "Aerial Timber Transport"
  logging_4_desc: "Using helicopters and cable yarding systems to transport felled logs reduces the need for damaging road networks through sensitive forests. This innovation expands logging into previously inaccessible regions and improves extraction efficiency in mountainous areas."
  logging_5: "Pulp and Biomass Integration"
  logging_5_desc: "With the development of pulp mills and biomass utilization, even the byproducts of logging gain economic value. This transforms forestry into a high-efficiency industry and enables a circular approach to wood processing, with applications in paper, chemicals, and energy."
  logging_6: "Integrated Forest-Industry Complexes"
  logging_6_desc: "The most advanced nations develop vast industrial ecosystems around forestry—where logging, processing, energy, and export are tightly integrated. These complexes dominate global timber markets while balancing sustainability with economic output through cutting-edge technologies."
  plantations: "Plantations"
  plantations_desc: "Plantations represent large-scale, labor-intensive agricultural operations producing cash crops for export or domestic markets."
  plantations_1: "Commercial Agriculture Foundations"
  plantations_1_desc: "Laying the groundwork for scaled-up farming, this technology formalizes large landholdings, specialized cash crop cultivation, and centralized labor organization. Plantations become structured, investment-backed enterprises aiming for consistent output and profit."
  plantations_2: " Mechanized Field Operations"
  plantations_2_desc: "The adoption of tractors, plows, and harvesters replaces manual labor with machine power. Crops like cotton, sugarcane, and tobacco can now be grown and harvested more efficiently across vast monoculture estates."
  plantations_3: "Irrigation and Fertilization Systems"
  plantations_3_desc: "Modern irrigation canals, pump systems, and the industrial production of nitrogen fertilizers boost yields dramatically. Even arid or semi-arid regions become viable for high-output plantation farming under proper management."
  plantations_4: "Agrochemical Integration"
  plantations_4_desc: "Widespread use of herbicides, pesticides, and chemical growth regulators marks the rise of chemically managed agriculture. Crop losses decrease, and plantation output becomes more predictable—though with emerging environmental and health costs."
  plantations_5: "Hybrid Crops and Seed Engineering"
  plantations_5_desc: "Selective breeding and the first hybrid seeds allow for faster-growing, disease-resistant, and climate-adapted varieties. Plantations leveraging these advances gain a significant edge in consistency and export competitiveness."
  plantations_6: "Agro-Industrial Complexes"
  plantations_6_desc: "Fully integrated systems combine land management, processing, packaging, and global shipping under single corporate or state-owned entities. These complexes operate like factories, fusing agriculture with industrial precision and scale."
  mining_1: "Industrial Extraction Methods"
  mining_1_desc: "Modern mining begins with the application of steam drills, explosive blasting, and steel supports, enabling deeper and more stable shafts. Coal, iron, and copper extraction scales up rapidly, fueling heavy industry and early electrification."
  mining_2: "Diesel and Pneumatic Equipment"
  mining_2_desc: "The introduction of diesel engines, pneumatic drills, and haulage systems improves worker efficiency and reduces reliance on animal or manual labor. Open-pit and underground mines alike benefit from the mechanization of core operations."
  mining_3: "Ore Concentration and Refinement"
  mining_3:desc: "Chemical leaching, flotation, and magnetic separation techniques increase yield by extracting more usable material from low-grade ores. Processing facilities become essential to the mining operation, shifting value upstream."
  mining_4: "Automated Conveyor and Ventilation Systems"
  mining_4_desc: "Integrated conveyor belts and advanced ventilation greatly improve the safety and efficiency of deep-mine operations. Mines can now operate continuously, with fewer workers and lower risks of collapse or gas exposure."
  mining_5: "Remote and Hazardous Zone Operations"
  mining_5_desc: "Mining expands into formerly inaccessible or dangerous environments—arctic tundra, deserts, warzones—through mobile rigs, modular processing units, and reinforced extraction platforms. National security and strategic stockpiling drive these efforts."
  mining_6: "Resource-Integrated Industrial Networks"
  mining_6_desc: "Mining becomes fully embedded in national economic infrastructure. Materials move seamlessly from extraction to processing to manufacturing via rail, pipeline, and digital logistics. Strategic minerals like uranium, lithium, and rare earths gain heightened geopolitical importance."
  dye_factory: "Synthetic Dye Production"
  dye_factory_desc: "The discovery of coal tar dyes unlocks a new era in color manufacturing. Replacing costly natural dyes like indigo or cochineal, these synthetic alternatives allow factories to mass-produce vibrant, stable pigments for textiles and inks."
  dye_factory_1: "Aniline and Acid Dye Expansion"
  dye_factory_1_desc: "Aniline-based chemistry diversifies the dye palette with intense reds, purples, and blacks. Acid dyes emerge for wool and silk, enabling vivid coloration of natural fibers. Safety and consistency improve, even as toxic byproducts remain a concern."
  dye_factory_2: "Petrochemical Feedstocks"
  dye_factory_2_desc: "The dye industry shifts from coal tar to oil-based compounds. New aromatic hydrocarbons expand dye chemistry, making colorants cheaper, longer-lasting, and more diverse—while also tying dye production to global petroleum supply chains."
  dye_factory_3: "Continuous Batch Processing"
  dye_factory_3_desc: "Large-scale dye factories adopt continuous flow systems, boosting throughput and standardization. Automation reduces labor requirements and error rates while enabling 24/7 chemical production tailored to textile industry demand."
  dye_factory_4: "Synthetic Fiber Compatibility"
  dye_factory_4_desc: "With the rise of nylon, rayon, and polyester, dye formulations adapt to synthetic fabrics. New dispersal and vat dye technologies allow vibrant, heat-resistant colors to bond with artificial fibers, redefining fashion and industrial textiles alike."
  dye_factory_5: "Industrial Waste Recovery and Recycling"
  dye_factory_5_desc: "Chemical engineers develop filtration, neutralization, and recovery systems to handle toxic runoff from dye production. Waste dyes are captured and reused, while emerging environmental regulations push factories toward closed-loop processes."
  dye_factory_6: "Advanced Color Engineering"
  dye_factory_6_desc: "Cutting-edge research enables dyes with specialized properties—UV resistance, anti-fade coatings, even thermochromic and fluorescent applications. Precision chemistry links dye factories to military, medical, and high-end manufacturing sectors."
   