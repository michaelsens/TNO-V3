  # TECH
  tooling_workshops: "Tooling Workshops"
  logging: "Logging"
  logging_desc: "Basic logging represents the organized harvesting of forests using traditional hand tools and simple labor. This technology establishes the foundation of the timber industry, enabling rudimentary sawmills and early economic exploitation of woodlands."
  logging_1: "Improved Logging"
  logging_1_desc: "Advances in gasoline-powered equipment and transportation revolutionize the industry. Portable saws, tractors, and early logging trucks reduce manual labor and increase output, bringing deep forests within economic reach."
  logging_2: " Mechanized Logging"
  logging_2_desc: "The age of axes and handsaws is over. By mechanizing logging operations with chainsaws, tractors, and rudimentary logging trucks, nations can significantly boost timber production while reducing labor intensity. This technology lays the groundwork for an industrial forestry sector."
  logging_3: "Hydraulic Logging Systems"
  logging_3_desc: "Hydraulic skidders and feller-bunchers revolutionize timber harvesting, allowing faster, more efficient felling and extraction of trees. These machines minimize downtime and increase the scale of forest exploitation, especially in rugged terrains."
  logging_4: "Aerial Timber Transport"
  logging_4_desc: "Using helicopters and cable yarding systems to transport felled logs reduces the need for damaging road networks through sensitive forests. This innovation expands logging into previously inaccessible regions and improves extraction efficiency in mountainous areas."
  logging_5: "Pulp and Biomass Integration"
  logging_5_desc: "With the development of pulp mills and biomass utilization, even the byproducts of logging gain economic value. This transforms forestry into a high-efficiency industry and enables a circular approach to wood processing, with applications in paper, chemicals, and energy."
  logging_6: "Integrated Forest-Industry Complexes"
  logging_6_desc: "The most advanced nations develop vast industrial ecosystems around forestry—where logging, processing, energy, and export are tightly integrated. These complexes dominate global timber markets while balancing sustainability with economic output through cutting-edge technologies."
  plantations: "Plantations"
  plantations_desc: "Plantations represent large-scale, labor-intensive agricultural operations producing cash crops for export or domestic markets."
  plantations_1: "Commercial Agriculture Foundations"
  plantations_1_desc: "Laying the groundwork for scaled-up farming, this technology formalizes large landholdings, specialized cash crop cultivation, and centralized labor organization. Plantations become structured, investment-backed enterprises aiming for consistent output and profit."
  plantations_2: " Mechanized Field Operations"
  plantations_2_desc: "The adoption of tractors, plows, and harvesters replaces manual labor with machine power. Crops like cotton, sugarcane, and tobacco can now be grown and harvested more efficiently across vast monoculture estates."
  plantations_3: "Irrigation and Fertilization Systems"
  plantations_3_desc: "Modern irrigation canals, pump systems, and the industrial production of nitrogen fertilizers boost yields dramatically. Even arid or semi-arid regions become viable for high-output plantation farming under proper management."
  plantations_4: "Agrochemical Integration"
  plantations_4_desc: "Widespread use of herbicides, pesticides, and chemical growth regulators marks the rise of chemically managed agriculture. Crop losses decrease, and plantation output becomes more predictable—though with emerging environmental and health costs."
  plantations_5: "Hybrid Crops and Seed Engineering"
  plantations_5_desc: "Selective breeding and the first hybrid seeds allow for faster-growing, disease-resistant, and climate-adapted varieties. Plantations leveraging these advances gain a significant edge in consistency and export competitiveness."
  plantations_6: "Agro-Industrial Complexes"
  plantations_6_desc: "Fully integrated systems combine land management, processing, packaging, and global shipping under single corporate or state-owned entities. These complexes operate like factories, fusing agriculture with industrial precision and scale."
  mining_1: "Industrial Extraction Methods"
  mining_1_desc: "Modern mining begins with the application of steam drills, explosive blasting, and steel supports, enabling deeper and more stable shafts. Coal, iron, and copper extraction scales up rapidly, fueling heavy industry and early electrification."
  mining_2: "Diesel and Pneumatic Equipment"
  mining_2_desc: "The introduction of diesel engines, pneumatic drills, and haulage systems improves worker efficiency and reduces reliance on animal or manual labor. Open-pit and underground mines alike benefit from the mechanization of core operations."
  mining_3: "Ore Concentration and Refinement"
  mining_3:desc: "Chemical leaching, flotation, and magnetic separation techniques increase yield by extracting more usable material from low-grade ores. Processing facilities become essential to the mining operation, shifting value upstream."
  mining_4: "Automated Conveyor and Ventilation Systems"
  mining_4_desc: "Integrated conveyor belts and advanced ventilation greatly improve the safety and efficiency of deep-mine operations. Mines can now operate continuously, with fewer workers and lower risks of collapse or gas exposure."
  mining_5: "Remote and Hazardous Zone Operations"
  mining_5_desc: "Mining expands into formerly inaccessible or dangerous environments—arctic tundra, deserts, warzones—through mobile rigs, modular processing units, and reinforced extraction platforms. National security and strategic stockpiling drive these efforts."
  mining_6: "Resource-Integrated Industrial Networks"
  mining_6_desc: "Mining becomes fully embedded in national economic infrastructure. Materials move seamlessly from extraction to processing to manufacturing via rail, pipeline, and digital logistics. Strategic minerals like uranium, lithium, and rare earths gain heightened geopolitical importance."
  dye_factory: "Synthetic Dye Production"
  dye_factory_desc: "The discovery of coal tar dyes unlocks a new era in color manufacturing. Replacing costly natural dyes like indigo or cochineal, these synthetic alternatives allow factories to mass-produce vibrant, stable pigments for textiles and inks."
  dye_factory_1: "Aniline and Acid Dye Expansion"
  dye_factory_1_desc: "Aniline-based chemistry diversifies the dye palette with intense reds, purples, and blacks. Acid dyes emerge for wool and silk, enabling vivid coloration of natural fibers. Safety and consistency improve, even as toxic byproducts remain a concern."
  dye_factory_2: "Petrochemical Feedstocks"
  dye_factory_2_desc: "The dye industry shifts from coal tar to oil-based compounds. New aromatic hydrocarbons expand dye chemistry, making colorants cheaper, longer-lasting, and more diverse—while also tying dye production to global petroleum supply chains."
  dye_factory_3: "Continuous Batch Processing"
  dye_factory_3_desc: "Large-scale dye factories adopt continuous flow systems, boosting throughput and standardization. Automation reduces labor requirements and error rates while enabling 24/7 chemical production tailored to textile industry demand."
  dye_factory_4: "Synthetic Fiber Compatibility"
  dye_factory_4_desc: "With the rise of nylon, rayon, and polyester, dye formulations adapt to synthetic fabrics. New dispersal and vat dye technologies allow vibrant, heat-resistant colors to bond with artificial fibers, redefining fashion and industrial textiles alike."
  dye_factory_5: "Industrial Waste Recovery and Recycling"
  dye_factory_5_desc: "Chemical engineers develop filtration, neutralization, and recovery systems to handle toxic runoff from dye production. Waste dyes are captured and reused, while emerging environmental regulations push factories toward closed-loop processes."
  dye_factory_6: "Advanced Color Engineering"
  dye_factory_6_desc: "Cutting-edge research enables dyes with specialized properties—UV resistance, anti-fade coatings, even thermochromic and fluorescent applications. Precision chemistry links dye factories to military, medical, and high-end manufacturing sectors."
  heavy_equipment_manufactury: "Industrial Machinery Fabrication"
  heavy_equipment_manufactury_desc: "Foundries and assembly shops begin producing durable, large-scale machinery—cranes, presses, boilers, and diggers. These machines form the backbone of mining, construction, and transportation infrastructure across industrial economies."

  heavy_equipment_manufactury_1: "Diesel and Hydraulic Systems"
  heavy_equipment_manufactury_1_desc: "The integration of diesel engines and hydraulic systems into heavy equipment allows machines to perform with greater power, control, and mobility. Bulldozers, excavators, and graders become standard tools for state and industrial development."

  heavy_equipment_manufactury_2: "Standardization and Interchangeable Parts"
  heavy_equipment_manufactury_2_desc: "Machine tools and components are manufactured to standardized specifications, enabling easier repairs, mass production, and global compatibility. Equipment becomes modular, allowing for quicker assembly and field maintenance."

  heavy_equipment_manufactury_3: "Tracked and All-Terrain Platforms"
  heavy_equipment_manufactury_3_desc: "Tracked chassis, reinforced suspensions, and amphibious features allow heavy equipment to operate in remote or hostile environments. Infrastructure megaprojects and military logistics both benefit from greater machine mobility and ruggedness."

  heavy_equipment_manufactury_4: "CNC and Precision Engineering"
  heavy_equipment_manufactury_4_desc: "Computer Numerical Control (CNC) and precision machining enable the production of tighter-tolerance parts for engines, actuators, and arms. Factories can now produce custom heavy machinery faster, with fewer errors and higher performance."

  heavy_equipment_manufactury_5: "Automated Assembly and Robotics"
  heavy_equipment_manufactury_5_desc: "Robotic arms and automated assembly lines reduce labor costs and dramatically increase production speed. Heavy equipment is built with unprecedented consistency, fueling national development, infrastructure expansion, and Cold War-era rearmament."
  
  heavy_equipment_manufactury_6: "Strategic Industry Integration"
  heavy_equipment_manufactury_6_desc: "Heavy equipment manufacturing becomes tightly woven into military, energy, and industrial megaprojects. These factories can rapidly pivot between civilian and strategic outputs—from power shovels and dam turbines to armored recovery vehicles and missile transporters."

 consumer_electronics: "Postwar Consumer Devices"
consumer_electronics_desc: "The spread of radios, televisions, and simple household appliances defines the first wave of postwar consumer electronics. Mass production and basic automation bring modern comfort into millions of homes."

consumer_electronics_1: "Transistor Revolution"
consumer_electronics_1_desc: "Transistors replace vacuum tubes, allowing electronics to become smaller, cheaper, and more reliable. This breakthrough paves the way for portable radios, early calculators, and new forms of home entertainment."

consumer_electronics_2: "Microprocessors and Digital Controls"
consumer_electronics_2_desc: "The development of microprocessors transforms consumer electronics. Devices now include digital controls, memory storage, and programmable features—leading to the rise of home computers and digital media players."

consumer_electronics_3: "Mobile and Wireless Integration"
consumer_electronics_3_desc: "Cellular phones, Wi-Fi, and mobile computing change how people interact with technology. Laptops, MP3 players, and digital cameras become common as households grow increasingly connected."

consumer_electronics_4: "Personal Digital Assistants and Basic Mobile Phones"
consumer_electronics_4_desc: "Early mobile phones and PDAs offer limited internet access, email, and basic apps. These devices mark the beginning of personal computing on the go, setting the foundation for smarter, more capable devices."

consumer_electronics_5: "Wearables and IoT Ecosystems"
consumer_electronics_5_desc: "Smartwatches, fitness trackers, and household IoT devices form a fully integrated digital environment. Everything from refrigerators to thermostats connects to the internet, blurring the line between hardware and software."

consumer_electronics_6: "Smartphones and Digital Convergence"
consumer_electronics_6_desc: "Smartphones with touchscreens, app stores, and multimedia capabilities redefine personal technology. The early 2000s see rapid adoption of these devices, integrating communication, entertainment, and productivity into a single handheld platform."

plastic_manufacturing_plants: "Early Synthetic Polymer Production"
plastic_manufacturing_plants_desc: "The birth of synthetic plastics begins with materials like Bakelite and celluloid, enabling mass production of affordable, versatile goods that revolutionize manufacturing and daily life."

plastic_manufacturing_plants_1: "Thermoplastics and Injection Molding"
plastic_manufacturing_plants_1_desc: "The development of thermoplastics such as polyethylene and polypropylene, along with injection molding techniques, allows rapid, high-volume production of durable plastic products across industries."

plastic_manufacturing_plants_2: "Polymer Blends and Additives"
plastic_manufacturing_plants_2_desc: "Innovations in polymer chemistry introduce blends and additives that improve flexibility, strength, and resistance. Plastics become suitable for specialized uses from automotive parts to consumer packaging."

plastic_manufacturing_plants_3: "Film and Fiber Manufacturing"
plastic_manufacturing_plants_3_desc: "Plastic films and synthetic fibers like nylon and polyester enter the market, transforming textiles, packaging, and industrial applications with lightweight, strong, and cheap alternatives to natural materials."

plastic_manufacturing_plants_4: "Advanced Polymer Processing"
plastic_manufacturing_plants_4_desc: "Techniques such as extrusion, blow molding, and thermoforming mature, enabling complex shapes and thin-walled containers. Production efficiency improves alongside product quality and variety."

plastic_manufacturing_plants_5: "Recycling and Environmental Controls"
plastic_manufacturing_plants_5_desc: "Growing awareness of plastic waste prompts the adoption of recycling technologies and pollution controls. Factories begin integrating recovery systems to reduce environmental impact and conserve raw materials."

plastic_manufacturing_plants_6: "High-Performance Polymers and Composites"
plastic_manufacturing_plants_6_desc: "The introduction of advanced polymers and composites with enhanced durability, heat resistance, and lightweight properties fuels industries from aerospace to electronics, marking a new era of material science."

paper_mills: "Mechanical Pulp Processing"
paper_mills_desc: "Early paper mills rely on mechanical pulping to convert wood into pulp, producing coarse paper primarily used for newspapers and packaging materials."

paper_mills_1: "Chemical Pulping Techniques"
paper_mills_1_desc: "Chemical methods like the Kraft and sulfite processes produce stronger, higher-quality paper by breaking down lignin and separating fibers more thoroughly."

paper_mills_2: "Bleaching and Whitening Processes"
paper_mills_2_desc: "Advances in bleaching technology allow the production of bright white papers, suitable for books, magazines, and fine printing."

paper_mills_3: "High-Speed Paper Machines"
paper_mills_3_desc: "The introduction of high-speed continuous paper machines dramatically increases production volume and efficiency, meeting the demands of growing print media and packaging industries."

paper_mills_4: "Coated and Specialty Papers"
paper_mills_4_desc: "Coating technologies improve paper surface smoothness and gloss, enabling high-quality printing and photographic papers, as well as specialty applications like currency and security printing."

paper_mills_5: "Recycling and Waste Paper Integration"
paper_mills_5_desc: "Recycling becomes a key component of paper production, incorporating recovered paper fibers to reduce reliance on virgin pulp and lower environmental impact."

paper_mills_6: "Advanced Fiber Engineering and Digital Paper"
paper_mills_6_desc: "Innovations in fiber treatments and synthetic additives create papers optimized for digital printing and industrial uses, while production facilities integrate computerized controls for quality and efficiency."

textile: "Mechanized Weaving and Spinning"
textile_desc: "The industrialization of textile production begins with mechanized spinning and weaving, greatly increasing fabric output and enabling mass production of cotton and woolen goods."

textile_1: "Synthetic Fibers Development"
textile_1_desc: "The invention and commercial production of synthetic fibers like nylon and polyester revolutionize textiles, providing durable, elastic, and inexpensive alternatives to natural materials."

textile_2: "Blended and Performance Fabrics"
textile_2_desc: "Blending natural and synthetic fibers creates fabrics with improved strength, comfort, and functionality, opening new markets in sportswear, uniforms, and fashion."

textile_3: "Chemical Treatments and Dye Technologies"
textile_3_desc: "Advanced dyeing and finishing techniques enhance fabric colorfastness, texture, and resistance to water and stains, expanding textile applications across industries."

textile_4: "Automated Looms and Production Lines"
textile_4_desc: "Automation of weaving and finishing processes improves efficiency and reduces labor costs, enabling large-scale production to meet growing consumer demand."

textile_5: "Technical and Smart Textiles"
textile_5_desc: "The emergence of textiles with embedded sensors, moisture-wicking properties, and enhanced durability marks the beginning of smart fabrics designed for specialized industrial and consumer uses."

textile_6: "Sustainable and Recycled Fibers"
textile_6_desc: "Growing environmental concerns lead to the adoption of sustainable fibers and recycling technologies, reducing waste and energy use while maintaining high production standards."

glassworks: "Traditional Glassmaking"
glassworks_desc: "Artisan glassworks use manual techniques like glass blowing and casting to produce decorative and utilitarian glass products, maintaining centuries-old craftsmanship traditions."

glass: "Industrial Glass Production"
glass_desc: "The advent of industrial glassmaking introduces automated furnaces and forming machines, enabling mass production of flat glass and bottles essential for construction, packaging, and consumer goods."

glass_1: "Float Glass Process"
glass_1_desc: "The float glass method revolutionizes flat glass production by producing perfectly smooth, uniform sheets, critical for windows, automotive windshields, and architectural applications."

glass_2: "Tempered and Safety Glass"
glass_2_desc: "Heat-treatment and lamination techniques produce stronger, shatter-resistant glass that improves safety in vehicles, buildings, and consumer products."

glass_3: "Specialty and Optical Glass"
glass_3_desc: "Advanced chemical formulations and precision manufacturing create glass suited for lenses, fiber optics, and scientific instruments, expanding industrial and military uses."

glass_4: "Coated and Insulating Glass"
glass_4_desc: "Reflective coatings and multi-layer insulating glass units improve energy efficiency in buildings and vehicles, supporting growing environmental and comfort standards."

glass_5: "Automated Glass Processing"
glass_5_desc: "Robotic cutting, shaping, and assembly lines increase production speed and reduce waste, enabling complex glass components for electronics and architecture."

glass_6: "Smart and Functional Glass"
glass_6_desc: "Glass embedded with technologies like electrochromic tinting, solar control, and self-cleaning surfaces transforms everyday environments, integrating energy management and user interaction."

furniture_manufacturies: "Traditional Woodworking"
furniture_manufacturies_desc: "Furniture production relies on skilled carpentry and hand tools, crafting pieces with artisanal care. Production is limited in scale, focusing on quality and custom designs."

furniture_manufacturies_1: "Mechanized Production Techniques"
furniture_manufacturies_1_desc: "The introduction of power tools and assembly lines increases production speed and volume. Basic mechanization reduces labor costs while maintaining standard designs."

furniture_manufacturies_2: "Use of Engineered Wood and Composites"
furniture_manufacturies_2_desc: "Materials like plywood, particleboard, and fiberboard become common, enabling affordable, lightweight furniture with consistent quality suitable for mass markets."

furniture_manufacturies_3: "Modern Upholstery and Fabrics"
furniture_manufacturies_3_desc: "Advances in synthetic fabrics and foam padding improve comfort and durability, expanding furniture styles and consumer appeal."

furniture_manufacturies_4: "Computer-Aided Design and Manufacturing"
furniture_manufacturies_4_desc: "CAD systems and CNC machines allow precise design and cutting, reducing waste and enabling complex shapes and customizable furniture at scale."

furniture_manufacturies_5: "Automated Assembly and Modular Systems"
furniture_manufacturies_5_desc: "Robotic assembly lines and modular design techniques streamline production, making flat-pack furniture and mass customization widely available."

furniture_manufacturies_6: "Sustainable and Smart Furniture"
furniture_manufacturies_6_desc: "Sustainable materials, eco-friendly finishes, and integrated smart technology define the latest furniture trends, blending environmental responsibility with connectivity and adaptability."

household_appliances: "Basic Electric Appliances"
household_appliances_desc: "Electric irons, toasters, and kettles become common in households, improving daily convenience and marking the start of modern kitchen and home appliances."

household_appliances_1: "Automated Laundry and Cooking Devices"
household_appliances_1_desc: "The introduction of washing machines, electric ovens, and refrigerators revolutionizes home life, reducing labor and increasing efficiency in domestic chores."

household_appliances_2: "Improved Energy Efficiency and Safety"
household_appliances_2_desc: "Appliances incorporate better insulation, thermostats, and safety mechanisms, lowering energy consumption and making devices safer and more reliable."

household_appliances_3: "Programmable and Timer Controls"
household_appliances_3_desc: "Timers and programmable settings allow users to automate appliance operation, increasing convenience and optimizing performance."

household_appliances_4: "Compact and Portable Appliances"
household_appliances_4_desc: "Smaller, lightweight appliances such as microwave ovens and portable vacuum cleaners become household staples, offering flexibility and saving space."

household_appliances_5: "Energy Star and Environmental Standards"
household_appliances_5_desc: "Growing environmental awareness leads to appliances meeting strict energy efficiency standards and incorporating eco-friendly materials."

household_appliances_6: "Smart and Connected Home Devices"
household_appliances_6_desc: "Wi-Fi enabled appliances integrated with smart home systems allow remote control, diagnostics, and energy management, creating seamless and intelligent household environments."
food: "Mass Food Processing"
food_desc: "Industrial food factories begin large-scale processing of staples like canned goods, flour, and dairy products, enabling wider distribution and longer shelf life."

food_1: "Frozen Food and Refrigeration"
food_1_desc: "The development of freezing and refrigeration technologies revolutionizes food preservation, expanding markets and reducing seasonal shortages."

food_2: "Convenience and Ready-to-Eat Meals"
food_2_desc: "The rise of frozen dinners, snack foods, and canned ready meals changes consumer habits, emphasizing convenience and quick preparation."

food_3: "Food Packaging and Safety Standards"
food_3_desc: "Improved packaging materials and hygiene regulations increase product safety and shelf stability, boosting consumer confidence and reducing waste."

food_4: "Automation and Quality Control"
food_4_desc: "Automated assembly lines and early computer controls increase production efficiency and consistency in taste, texture, and nutrition."

food_5: "Genetically Modified and Fortified Foods"
food_5_desc: "Biotechnology introduces genetically modified crops and fortified products aimed at improving nutrition and agricultural resilience."

food_6: "Organic and Sustainable Food Production"
food_6_desc: "Growing environmental and health concerns spur organic farming methods and sustainable factory practices, catering to a more health-conscious market."
steel: "Basic Steelmaking"
steel_desc: "Traditional blast furnaces and open-hearth methods produce steel to meet growing industrial and construction demands, forming the backbone of postwar development."

steel_1: "Basic Electric Arc Furnaces"
steel_1_desc: "The introduction of basic oxygen and electric arc furnaces increases production speed and efficiency, reducing costs and enabling mass steel manufacturing."

steel_2: "Continuous Casting and Rolling"
steel_2_desc: "Advancements in continuous casting and rolling streamline steel shaping processes, improving quality and reducing waste for structural and manufacturing applications."

steel_3: "Alloy Steels and Heat Treatments"
steel_3_desc: "The development of alloy steels and specialized heat treatments enhances strength, corrosion resistance, and versatility for automotive, aerospace, and defense industries."

steel_4: "Stainless and High-Strength Steels"
steel_4_desc: "Stainless steel and other high-strength variants become widely used, offering durability and aesthetic appeal in architecture, appliances, and transportation."

steel_5: "Automated Steel Production"
steel_5_desc: "Automation and computer control improve precision and efficiency in steel plants, reducing labor costs and enabling just-in-time manufacturing."

steel_6: "Advanced Specialty Steels and Composites"
steel_6_desc: "Cutting-edge alloys and composite materials integrate steel with other elements for enhanced performance in demanding environments, pushing the boundaries of modern engineering."

shipyards: "Steel Hull Construction"
shipyards_desc: "Postwar shipyards focus on steel hull production using riveted and welded techniques, supporting commercial and naval fleets rebuilding after global conflicts."

shipyards_1: "Welding and Modular Assembly"
shipyards_1_desc: "The adoption of welding and modular assembly methods accelerates shipbuilding, allowing faster construction and easier repairs."

shipyards_2: "Diesel Engines and Propulsion Advances"
shipyards_2_desc: "Diesel power replaces steam engines, improving fuel efficiency and range for commercial vessels and military ships alike."

shipyards_3: "Specialized Vessel Design"
shipyards_3_desc: "Shipyards develop specialized vessels including container ships, oil tankers, and submarines to meet diverse commercial and strategic needs."

shipyards_4: "Automation and Computer-Aided Design"
shipyards_4_desc: "Computer-aided design and robotic welding increase precision and reduce labor costs, enabling complex ship structures and faster production times."

shipyards_5: "Advanced Materials and Coatings"
shipyards_5_desc: "The use of high-strength alloys, corrosion-resistant coatings, and lightweight composites enhances ship durability and performance."

shipyards_6: "Modular and Multi-Role Warships"
shipyards_6_desc: "Shipyards produce modular, multi-role warships capable of rapid refitting and equipped with advanced sensors, reflecting modern naval doctrines."

coal_plant: "Basic Steam Turbine Power"
coal_plant_desc: "Early coal-fired power plants use basic steam turbines to convert coal energy into electricity, providing reliable power to growing postwar industries and cities."

coal_plant_1: "Improved Boiler Efficiency"
coal_plant_1_desc: "Advances in boiler design and materials increase thermal efficiency, reducing coal consumption and operational costs."

coal_plant_2: "Electrostatic Precipitators"
coal_plant_2_desc: "The introduction of electrostatic precipitators helps reduce particulate emissions, addressing growing environmental and public health concerns."

coal_plant_3: "Supercritical Steam Technology"
coal_plant_3_desc: "Supercritical boilers operate at higher pressures and temperatures, significantly improving efficiency and reducing emissions per unit of electricity generated."

coal_plant_4: "Flue Gas Desulfurization"
coal_plant_4_desc: "Scrubbers and desulfurization systems reduce sulfur dioxide emissions, mitigating acid rain and environmental damage."

coal_plant_5: "Automated Control Systems"
coal_plant_5_desc: "Computerized control systems optimize combustion and plant operation, enhancing safety, efficiency, and responsiveness to grid demands."

coal_plant_6: "Integrated Emission Controls and Waste Management"
coal_plant_6_desc: "Advanced emission controls and waste management techniques minimize environmental impact, incorporating ash recycling and carbon capture experiments."

engines_1: "Improved Fuel Injection"
engines_1_desc: "Advancements in fuel delivery systems increase engine efficiency and power output, while reducing fuel consumption and emissions."

engines_2: "Diesel Engine Innovations"
engines_2_desc: "Diesel engines gain popularity for their superior fuel economy and torque, especially in heavy vehicles and industrial applications."

engines_3: "Turbocharging and Supercharging"
engines_3_desc: "Forced induction technologies improve engine performance and responsiveness, enabling smaller engines to produce greater power."

engines_4: "Electronic Engine Management"
engines_4_desc: "Electronic control units optimize engine timing and fuel mixture, improving efficiency, emissions, and adaptability to different fuels."

engines_5: "Hybrid and Alternative Fuel Engines"
engines_5_desc: "Early hybrid systems and alternative fuel technologies such as LPG and ethanol emerge, aiming to reduce dependency on conventional gasoline."

engines_6: "Advanced Combustion and Emission Controls"
engines_6_desc: "State-of-the-art combustion techniques and emission control technologies minimize pollutants while maximizing power and fuel economy, setting standards for modern engines."
   
oil_plant: "Basic Crude Oil Refining"
oil_plant_desc: "Early oil plants focus on simple distillation to separate crude oil into basic products like gasoline, kerosene, and lubricants to fuel postwar economies."

oil_plant_1: "Catalytic Cracking"
oil_plant_1_desc: "The introduction of catalytic cracking improves refinery efficiency, increasing gasoline yields and producing higher-quality fuels."

oil_plant_2: "Hydrodesulfurization"
oil_plant_2_desc: "Advanced desulfurization processes reduce sulfur content in fuels, helping to mitigate pollution and comply with emerging environmental regulations."

oil_plant_3: "Petrochemical Integration"
oil_plant_3_desc: "Refineries begin producing petrochemicals such as plastics, synthetic rubber, and fertilizers, diversifying output beyond fuels."

oil_plant_4: "Automated Process Control"
oil_plant_4_desc: "Computerized control systems optimize refining processes, increasing efficiency, safety, and product consistency."

oil_plant_5: "Environmental Emission Controls"
oil_plant_5_desc: "New technologies reduce emissions of volatile organic compounds and greenhouse gases, reflecting rising environmental concerns."

oil_plant_6: "Advanced Refining and Biorefinery Techniques"
oil_plant_6_desc: "Cutting-edge refining methods incorporate bio-based feedstocks and carbon capture, aiming for more sustainable and diversified fuel and chemical production."
machine_1: "Basic Machine Workshops"
machine_1_desc: "Workshops equipped with manual lathes, drills, and milling machines produce essential tools and machine parts, supporting local industry and repair needs."

machine_2: "Powered Machine Tools"
machine_2_desc: "The introduction of electric-powered machine tools increases precision and production speed, enabling higher quality components for growing industrial sectors."

machine_3: "Numerical Control (NC) Machines"
machine_3_desc: "Numerical control systems automate tool movements based on pre-set programs, improving accuracy and repeatability in machining complex parts."

machine_4: "Computer Numerical Control (CNC)"
machine_4_desc: "CNC technology integrates computers to control machining processes, allowing greater flexibility, faster changeovers, and higher productivity in manufacturing."

machine_5: "Automated and Robotic Tooling"
machine_5_desc: "Robotic arms and automated tool changers further increase efficiency and reduce labor, enabling continuous production and just-in-time manufacturing."

machine_6: "Smart and Networked Manufacturing"
machine_6_desc: "Tooling workshops become integrated with digital networks and sensors, facilitating real-time monitoring, predictive maintenance, and adaptive manufacturing strategies."

wheat_3: "Mechanized Harvesting"
wheat_3_desc: "The widespread adoption of combine harvesters dramatically increases efficiency by combining reaping, threshing, and winnowing into a single operation."

wheat_4: "Improved Seed Varieties"
wheat_4_desc: "Selective breeding and early hybridization yield higher-yielding, disease-resistant wheat strains, boosting farm productivity and food security."

wheat_5: "Chemical Fertilizers and Pesticides"
wheat_5_desc: "The use of synthetic fertilizers and pesticides enhances crop growth and reduces losses from pests and diseases, enabling larger-scale and more reliable harvests."

wheat_6: "Precision Agriculture and GMO Crops"
wheat_6_desc: "The introduction of genetically modified wheat varieties and precision farming techniques optimizes inputs and maximizes yields, shaping modern agricultural practices."

pumpjack_1: "Basic Mechanical Pumpjack"
pumpjack_1_desc: "Mechanical pumpjacks extract oil from wells using simple reciprocating motions powered by steam or early electric motors, enabling steady production from established fields."

pumpjack_2: "Improved Pump Efficiency"
pumpjack_2_desc: "Enhanced designs and stronger materials increase the reliability and efficiency of pumpjacks, reducing downtime and maintenance costs."

pumpjack_3: "Electric Motor Drives"
pumpjack_3_desc: "Electric motor-powered pumpjacks replace earlier steam-driven models, offering better control, efficiency, and operational flexibility."

pumpjack_4: "Remote Monitoring Systems"
pumpjack_4_desc: "The integration of remote sensors and telemetry allows operators to monitor pumpjack performance and well conditions from centralized control rooms."

pumpjack_5: "Automated Control and Optimization"
pumpjack_5_desc: "Automation systems regulate pump speed and stroke based on real-time data, maximizing extraction rates while minimizing wear and energy consumption."

pumpjack_6: "Smart Field Integration"
pumpjack_6_desc: "Networked pumpjacks communicate within digital oilfield systems, enabling predictive maintenance, optimized resource management, and seamless integration with broader energy infrastructure."

breweries: "Traditional Brewing Techniques"
breweries_desc: "Breweries rely on time-honored methods of fermentation and manual quality control, producing beer in limited batches with artisanal care."

breweries_1: "Mechanized Brewing Equipment"
breweries_1_desc: "The introduction of mechanized mixers, pumps, and kettles increases production capacity and consistency, meeting growing consumer demand."

breweries_2: "Pasteurization and Filtration"
breweries_2_desc: "Advances in pasteurization and filtration extend shelf life and improve beer clarity, allowing wider distribution and longer storage."

breweries_3: "Automated Fermentation Control"
breweries_3_desc: "Automated temperature and fermentation controls enhance quality and reduce spoilage, optimizing brewing conditions at scale."

breweries_4: "Bottling and Packaging Innovations"
breweries_4_desc: "Improvements in bottling lines and packaging materials streamline production and improve product freshness and transportability."

breweries_5: "Quality Assurance and Laboratory Analysis"
breweries_5_desc: "Modern laboratory techniques and quality assurance protocols ensure consistent flavor profiles and compliance with health standards."

breweries_6: "Craft Brewing and Specialty Production"
breweries_6_desc: "The rise of craft brewing emphasizes small-batch specialty beers, diverse styles, and innovative flavors, supported by flexible and efficient production technologies."

industrial_chemical_plants: "Basic Chemical Production"
industrial_chemical_plants_desc: "Early chemical plants produce essential industrial chemicals using traditional batch processes, supporting manufacturing, agriculture, and consumer goods."

industrial_chemical_plants_1: "Continuous Process Improvements"
industrial_chemical_plants_1_desc: "The shift to continuous chemical processing increases efficiency and output, enabling large-scale production of fertilizers, plastics, and solvents."

industrial_chemical_plants_2: "Catalytic and High-Pressure Techniques"
industrial_chemical_plants_2_desc: "Catalysts and high-pressure reactors improve reaction rates and yields, expanding the range of economically viable chemical products."

industrial_chemical_plants_3: "Process Automation and Control"
industrial_chemical_plants_3_desc: "Automated monitoring and control systems optimize chemical reactions, enhance safety, and reduce waste in increasingly complex plants."

industrial_chemical_plants_4: "Specialty Chemicals and Petrochemicals"
industrial_chemical_plants_4_desc: "Production diversifies into specialty chemicals, including pharmaceuticals, agrochemicals, and high-value petrochemicals for advanced industrial uses."

industrial_chemical_plants_5: "Environmental Management and Recycling"
industrial_chemical_plants_5_desc: "Environmental regulations drive the adoption of waste recycling, emissions controls, and cleaner production methods."

industrial_chemical_plants_6: "Green Chemistry and Sustainable Manufacturing"
industrial_chemical_plants_6_desc: "Innovations in green chemistry focus on sustainable raw materials, energy efficiency, and minimal environmental impact, reshaping the chemical industry for the future."

pharmaceutical_industries: "Early Pharmaceutical Production"
pharmaceutical_industries_desc: "Mass production of penicillin and other essential drugs marks the beginning of industrial-scale pharmaceutical manufacturing, focused on treating infectious diseases and improving public health."

pharmaceutical_industries_1: "Synthetic Drug Development"
pharmaceutical_industries_1_desc: "Advances in organic chemistry enable the creation of synthetic medications, including antihistamines, steroids, and early psychiatric drugs, expanding treatment options beyond natural compounds."

pharmaceutical_industries_2: "Clinical Trials and Regulation"
pharmaceutical_industries_2_desc: "Standardized clinical trials and stronger drug approval regulations improve drug safety and effectiveness, shaping modern pharmaceutical policy and consumer trust."

pharmaceutical_industries_3: "High-Throughput Screening"
pharmaceutical_industries_3_desc: "Automated testing of thousands of chemical compounds accelerates drug discovery, allowing researchers to identify promising treatments faster and more efficiently."

pharmaceutical_industries_4: "Biotechnology Integration"
pharmaceutical_industries_4_desc: "Genetic engineering and recombinant DNA technologies introduce a new class of biologic drugs, such as insulin analogues and monoclonal antibodies."

pharmaceutical_industries_5: "Globalized Manufacturing and Supply Chains"
pharmaceutical_industries_5_desc: "Advanced logistics and multinational production networks lower drug costs and improve global access, but also introduce challenges in quality control and regulatory consistency."

pharmaceutical_industries_6: "Personalized Medicine and Genomics"
pharmaceutical_industries_6_desc: "Genomic analysis and data-driven diagnostics pave the way for personalized medicine, with treatments tailored to individual genetic profiles and biomarkers."

explosives_1: "Safer Handling and Storage"
explosives_1_desc: "Advancements in chemical stability and containment reduce the risk of accidental detonation, making explosives safer for transportation and industrial use."

explosives_2: "Plastic and Moldable Explosives"
explosives_2_desc: "The introduction of plastic explosives revolutionizes military demolition and covert operations, offering powerful blasts in compact, moldable forms."

explosives_3: "Computer-Aided Blasting"
explosives_3_desc: "Computational tools enable precise blast modeling, optimizing explosive charges for mining, construction, and tactical applications."

explosives_4: "Smart Fuzing Systems"
explosives_4_desc: "Electronic and programmable fuzes allow detonations to be timed or triggered under specific conditions, increasing control and reducing collateral damage."

explosives_5: "Insensitive Munitions"
explosives_5_desc: "Insensitive explosives reduce vulnerability to heat, shock, and impact, enhancing safety in storage and battlefield conditions."

explosives_6: "Nano-Engineered Energetics"
explosives_6_desc: "Cutting-edge materials research enables nano-structured energetic compounds with higher yield, cleaner detonation, and advanced tactical versatility."

fertilizer_plants: "Post-War Ammonia Synthesis"
fertilizer_plants_desc: "Using refined Haber-Bosch methods, early industrial fertilizer plants mass-produce nitrogen-rich compounds to boost agricultural yields during the post-war food boom."

fertilizer_plants_1: "Phosphate and Potash Integration"
fertilizer_plants_1_desc: "The expansion of fertilizer blends to include phosphorus and potassium improves crop health and resilience, fueling the Green Revolution."

fertilizer_plants_2: "Granulation and Controlled Release"
fertilizer_plants_2_desc: "Modern processing allows fertilizers to be granulated and coated, reducing runoff and enabling slow, consistent nutrient delivery to crops."

fertilizer_plants_3: "Automated Mixing and Packaging"
fertilizer_plants_3_desc: "Automation enhances the efficiency of fertilizer production, ensuring more precise mixtures and safer handling across distribution networks."

fertilizer_plants_4: "Soil-Specific Formulations"
fertilizer_plants_4_desc: "Advancements in soil science allow for region- and crop-specific fertilizer blends, increasing yields while minimizing ecological harm."

fertilizer_plants_5: "Environmental Controls and Emissions Reduction"
fertilizer_plants_5_desc: "Stricter environmental standards lead to cleaner production methods, including emissions scrubbing, wastewater treatment, and nutrient recycling."

fertilizer_plants_6: "Bio-Based and Smart Fertilizers"
fertilizer_plants_6_desc: "The latest generation of fertilizers incorporates bioengineered microbes, nanomaterials, and precision-release systems to support sustainable, high-efficiency farming."

semiconductor_plant: "Early Semiconductor Fabrication"
semiconductor_plant_desc: "Building on breakthroughs in transistor design, early semiconductor plants begin producing rudimentary silicon components for radios, calculators, and military equipment."

semiconductor_plant_1: "Integrated Circuit Manufacturing"
semiconductor_plant_1_desc: "The invention of the integrated circuit enables semiconductors to contain multiple components, dramatically increasing performance and paving the way for microelectronics."

semiconductor_plant_2: "Photolithography and Clean Rooms"
semiconductor_plant_2_desc: "Cleanroom environments and precision photolithography techniques allow the miniaturization and mass production of increasingly complex microchips."

semiconductor_plant_3: "Very Large Scale Integration (VLSI)"
semiconductor_plant_3_desc: "VLSI packs thousands of transistors onto a single chip, ushering in the era of personal computing, consumer electronics, and powerful industrial control systems."

semiconductor_plant_4: "Submicron and CMOS Processes"
semiconductor_plant_4_desc: "Submicron fabrication and complementary metal-oxide-semiconductor (CMOS) technology reduce power consumption and enable mobile computing and advanced embedded systems."

semiconductor_plant_5: "Global Foundries and Design Separation"
semiconductor_plant_5_desc: "As chip design and manufacturing split into specialized global industries, semiconductor plants become larger, more automated, and tightly integrated into global supply chains."

semiconductor_plant_6: "Nanometer-Scale Fabrication"
semiconductor_plant_6_desc: "Early 2000s breakthroughs enable transistors measured in nanometers, powering fast, efficient chips for mobile devices, servers, and high-end computing applications."

synthetic_rubber_plant: "Post-War Polymerization"
synthetic_rubber_plant_desc: "Wartime research leads to the widespread use of synthetic rubber, allowing nations to reduce dependence on natural rubber and expand industrial and military applications."

synthetic_rubber_plant_1: "Oil-Based Rubber Production"
synthetic_rubber_plant_1_desc: "Petrochemical processes refine synthetic rubber quality and volume, making it a mainstay in tires, insulation, and industrial goods."

synthetic_rubber_plant_2: "Elastomer Blending and Customization"
synthetic_rubber_plant_2_desc: "Blending different synthetic polymers produces elastomers tailored for specific roles, from shock absorption to chemical resistance."

synthetic_rubber_plant_3: "Automated Mixing and Curing"
synthetic_rubber_plant_3_desc: "Computerized controls in mixing and vulcanization improve consistency and throughput, meeting rising demands from automotive and aerospace sectors."

synthetic_rubber_plant_4: "Environmental Stabilizers and Recycling"
synthetic_rubber_plant_4_desc: "New additives reduce rubber degradation from UV and ozone, while recycling techniques begin recovering synthetic rubber for reuse."

synthetic_rubber_plant_5: "High-Performance Thermoplastics"
synthetic_rubber_plant_5_desc: "Thermoplastic elastomers combine the flexibility of rubber with the durability and easy processing of plastics, expanding applications in electronics and medical devices."

synthetic_rubber_plant_6: "Nanocomposite and Smart Rubber"
synthetic_rubber_plant_6_desc: "Advanced materials science enables nanostructured rubbers with embedded sensors, shape-memory properties, and extreme durability for use in cutting-edge industries."

automotive_industry: "Post-War Mass Auto Production"
automotive_industry_desc: "The global boom in automobile ownership drives major investments in assembly lines, standardization, and steel-based vehicle manufacturing."

automotive_industry_1: "Compact and Economical Design"
automotive_industry_1_desc: "Rising fuel prices and urban congestion in the 1960s and 70s lead to compact car designs, emphasizing fuel efficiency, lower costs, and new international competition."

automotive_industry_2: "Automation and Robotic Assembly"
automotive_industry_2_desc: "Factory automation and industrial robotics transform automotive production, increasing speed and precision while reducing labor costs."

automotive_industry_3: "Safety and Emission Standards"
automotive_industry_3_desc: "Government regulations around the world push the industry to innovate in safety features, crash resistance, and emissions control systems."

automotive_industry_4: "Electronic Control Systems"
automotive_industry_4_desc: "The integration of onboard computers and electronic fuel injection systems marks a shift toward digitally managed engine performance and diagnostics."

automotive_industry_5: "Globalized Supply Chains"
automotive_industry_5_desc: "Automobile manufacturing becomes a globally interconnected industry, with just-in-time logistics, offshore components, and transnational design strategies."

automotive_industry_6: "Hybrid Systems and Modular Platforms"
automotive_industry_6_desc: "Early 2000s breakthroughs in hybrid-electric drivetrains and modular vehicle architectures set the stage for high-efficiency, flexible manufacturing and eco-conscious innovation."

nuclear_plants: "Civilian Nuclear Power"
nuclear_plants_desc: "Harnessing the atom for peaceful purposes, nuclear power plants provide vast amounts of electricity with low carbon emissions, marking a new era in national energy infrastructure."

nuclear_times: "Nuclear Age Infrastructure"
nuclear_times_desc: "The integration of nuclear technologies into civilian and industrial systems defines the modern age—fueling not only power grids but also medicine, agriculture, and global politics."

