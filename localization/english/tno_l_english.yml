  2wrw_title: "The Second West Russian War"
  2wrw_reason: "At last, the #T Russian nation#! stands united under our banner.  The destructive and traitorous times of the Second Smuta have ended, yet millions of Russians still live West of our border, under the watchful subserviance of their German masters.\n\nGiven our title as the leader of the Russian nation, we must try once more what our predecessors have tried and failed twice: the liberation of our Homeland from the German foe."

  2gpw_title: "The Second Great Patriotic War"
  2gpw_reason: "At last, #R Russia#! has been united.  Unfortunately, millions of Russians and our glorious capital of #T Moskva#! now #R lie under the yoke of Germany.#!  The moment has arrived to execute our #R ultimate retaliation#!: eradicating the #R Fascist invader#! once and for all.\n\nThis incredible undertaking will only be possible by the #T desperate labor#! that our nation has endured to prepare itself for the coming struggle.  This war will come to define our history; it is #R all-in or nothing.#!  May God forgive us if we fail, for the only concievable result is total thermonuclear annihilation."

