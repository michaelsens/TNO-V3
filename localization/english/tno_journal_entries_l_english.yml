  fading: "Fading Fascism"
  fading_reason: "Duce of Italy Galeazzo Ciano is well known for being less aligned with typical fascism unlike his father in-law. This leads to many theories of Ciano possibly attempting to reorganize the regime to something less centralized on the Duce himself. Although these are mostly rumours, it still leads to a slow decline of our regime."
  king_only_in_name: "King Only In Name"
  king_only_in_name_reason: "The son of the late Italian King Emmanuel III, who brought Italy glory in the great war and avenged our country's prior humiliations, Umberto certainly has big shoes to fill. Despite this, he has proven himself to be a somewhat capable ruler, keeping the populace calm with his image as a King of peace, even as the threat of Germany looms north and the shores of the adriatic remain saltflats. He has, however, shown increasing discontent towards the Fascist party, something which might prove pivotal in the future. If we were return power to the king it is unknown what he will support."

  je_dependence_on_slavery:0 "Dependence on slavery"
  je_dependence_on_slavery_reason: "custom"
  cgui_ger_slavery_reason: "Slavery is widespread throughout the Reich and her eastern Lebensraum. Our dependence on slavery has weakened our economy."

  libya_cooldown: "Not on cooldown"
	cooldown_libya_forever: "You will no longer be able to press any buttons in this Journel but you can still fail."


  colonize_libya: "Colonize Libya"
  colonize_libya_reason: "The territories of Libya were annexed to the metropolitan kingdom of Italy in 1934 under the leadership of governor Italo Balbo. Since then, the indigenous Arabs who inhabit Libya have been granted the status of 'Italian Libyan citizens', which gives them a legal status identical to the Italians - however, this legal status is only valid as long as they reside in Libya. Outside of it, they are simply colonial subjects of the Crown. Libya has had several waves of Italian colonization since the war. Libya was meant for italians."
  
