  je_complete_with_buttons: "Click the relevant buttons on the [concept_journal_entry] to complete the objectives."
  je_complete_with_custom: "Use the [concept_journal_entry] to complete the objectives."

  je_ru_tno_sakha_expedition: "The Sakha Expedition"
  je_ru_tno_sakha_expedition_reason: "Soviet geologists expected to unearth the resource deposits in the Chernyshevsky region some time ago, with labor forces being deployed to make this a reality.  However, the plan was stopped due to the outbreak of the Second World War.  It is time to finally finish their work."
  tt.formed_far_east: "Has successfully united the #value;TOOLTIP: Far East#!"
  tt.not_on_expedition: "Is not already on an #value;TOOLTIP: expedition#!"
  tt.is_a_warlord: "is a #value;TOOLTIP: Russian warlord#!"

  je_ru_tno_repair_transib: "Repair the Trans-Siberian Railway"
  je_ru_tno_repair_transib_reason: "The #value;TOOLTIP: Trans-Siberian Railway#! was one of our nation's most notable and gratifying achievements of the 19th century.  Well before the onset of the #negative_value;TOOLTIP: Great Patriotic War#!, Bukharin's well-grounded #positive_value;TOOLTIP: Siberian Plan#! included a #positive_value;TOOLTIP: mass scale upgrade#! to the #value;TOOLTIP: Trans-Siberian Railway#!, bringing heaps of new infrastructure to the region.  These upgrades proved utterly important in the war, allowing American aid to be recieved through Siberian ports and sent to Western Russia to continue the fight.\n\nAlthough the railway could not save us the war, it can certainly provide us an avenue for attracting #positive_value;TOOLTIP: economic growth#! and #value;TOOLTIP: immigration#! to our region of Russia.\n\nUnfortunately, #negative_value;TOOLTIP: years of warlordism#! in Russia and general inactivity on the railway have left the tracks #negative_value;TOOLTIP: relatively unoperable.#!  It will take a #value;TOOLTIP: monumental#! but #value;TOOLTIP: neccessary#! effort to repair the rail line."
  je_transib_irkutsk_tt: "[SCOPE.sState('irkutsk_state_scope').GetName]: has 2 or more [concept_building_level] of [GetBuildingType('building_railway').GetName]"
  je_transib_buryatia_tt: "[SCOPE.sState('buryatia_state_scope').GetName]: has 2 or more [concept_building_level] of [GetBuildingType('building_railway').GetName]"
  je_transib_trans_baikal_tt: "[SCOPE.sState('trans_baikal_state_scope').GetName]: has 2 or more [concept_building_level] of [GetBuildingType('building_railway').GetName]"
  je_transib_okhotsk_tt: "[SCOPE.sState('okhotsk_state_scope').GetName]: has 2 or more [concept_building_level] of [GetBuildingType('building_railway').GetName]\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_transsib_repair_bonus')] Additionally, if we expand the [GetBuildingType('building_railway').GetName] [concept_building_level] in the states of [SCOPE.sState('upper_yeniseysk_state_scope').GetName], [SCOPE.sState('yakutsk_state_scope').GetName], [SCOPE.sState('chukotka_state_scope').GetName], and [SCOPE.sState('kamchatka_state_scope').GetName]:\n       The #positive_value;TOOLTIP: bonuses#! will be applied to #value;TOOLTIP: all aforementioned states.#!"
  transsib_complete_tt: "Every affected [concept_state] recieve #value;TOOLTIP: The Trans Siberian Railroad#! which grants:\n#positive_value;TOOLTIP: +20%#! Birth Rate#!\n   #positive_value;TOOLTIP: +20%#! [concept_migration] Attraction\n\n#value;TOOLTIP: The Trans Siberian Railroad#! lasts 10 years and will #negative_value;TOOLTIP: slowly decay over time.#!"
  
