 je_Sphere_lucknow_tension_reduce_momentum_desc: "The [SCOPE.sCountry('jap_nation_scope').GetAdjective] government, not wanting to lose its Indian proxy, has so far leveraged its influence on the HSS through #bold covert means#! to undermine the #white Lucknow Conference#!. We must act swiftly to counter Japanese interference and diminish their current influence on the #white HSS#!."
