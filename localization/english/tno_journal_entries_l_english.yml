 je_Sphere_lucknow_tension_reduce_instant_zero: "#yellow Gesture Unity#!"
 je_Sphere_lucknow_tension_reduce_instant_desc_zero: "In these times of #bold disunity and division,#! it is necessary to remind both the representatives and the population as a whole that ultimately #gold we a#!#white re all#! #light_green Indians,#! above all else.  Our leader will commit to a multi-day campaign, gesturing #bold unity#! and #bold Indian solidarity.#!"
 je_Sphere_lucknow_tension_reduce_instant_one: "#yellow Host Economic Integration Talks#!"
 je_Sphere_lucknow_tension_reduce_instant_desc_one: "Often times during a negotiation do intricacies of the fine details cause those involved to lose sight of the final goal—#bold a more unified and independent India.#!  Through subtle requests to our staff to 'lighten the mood' of the representatives, among other efforts, we will #white remind the representatives why we are all here#!."
 je_Sphere_lucknow_tension_reduce_instant_two: "#yellow Humanitarian Offensive#!"
 je_Sphere_lucknow_tension_reduce_instant_desc_two: "As the Conference drags on, the people in Eastern India are forced to #bold wait in desperation#! for the aid promised to them by this Conference's success.  By directing money towards some aid programs now, we can #bold buy time#! for the Conference to finish and a more permanent solution to be reached."
 je_Sphere_lucknow_tension_reduce_instant_three: "#yellow Grant Trade Relief#!"
 je_Sphere_lucknow_tension_reduce_instant_desc_three: "One of the major discussion points for the negotiations is a unified market between the two Indias.  By #bold reducing some trade restrictions now#!, we might be able to entice the other side towards acceptance through #bold lucrative trade deals,#! as well as #bold help Eastern India#! by way of lower priced goods."
 je_Sphere_lucknow_tension_reduce_instant_four: "#yellow Demilitarize the Border#!"
 je_Sphere_lucknow_tension_reduce_instant_desc_four: "Though our government continues to stress our #bold shared bond#! between the two Indias, those within our #bold Armed Forces#! are wary about letting our guard down.  By directly ordering our #bold Armed Forces#! to move away from the border, we can further create an aura of #bold unity and solidarity#!, hopefully convincing the other side to do the same."
 je_Sphere_lucknow_tension_reduce_instant_five: "#yellow Press Outreach#!"
 je_Sphere_lucknow_tension_reduce_instant_desc_five: "The Press can often get distracted with notions of #bold hatred and disunity#! that are inevitably brewing beneath the surface.  In order to circumvent this from further causing problems, government officials will #bold hold various press conferences#! to take the press spotlight away from events that further disunity among the population."
 je_Sphere_lucknow_tension_reduce_instant_six: "#yellow Host De-escalation Talks#!"
 je_Sphere_lucknow_tension_reduce_instant_desc_six: "The situation of tension in the population can quickly become #bold unmanagable#! should it be left unchecked.  We will host #bold high-profile de-escalation talks#!, in the hopes this will foster unity and cooperation in the population."

