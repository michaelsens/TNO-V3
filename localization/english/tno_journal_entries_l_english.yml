 je_West_African_Situation: "The West African Situation"
 je_West_African_Situation_reason: "custom"
 cgui_was_open_west_africa_situation: "Open The #R West#! #G African #gold Situation#!"
 cgui_was_reason_title: "#blue #bold THE WEST AFRICAN SITUATION#!"
 cgui_was_reason: "#R Wes#G t Af#gold rica#! #white once knew a tense peace under French rule—not from understanding, but because the spark of resistance hadn’t yet reached West Africa’s lush savannas.\n\nThat spark ignited when French rule collapsed in the late 1940s. In the East, native #R Came#G roon#! #white fighters battle fiercely to end colonial oppression and overturn the status quo. In the West, the #blue Fr#white en#R ch#! #white cling to the last remnant of an empire crumbling around them."
 
 

 je_bombing_west_africa: "Luftwaffe Terror Bombing"
 je_bombing_west_africa_reason: "Launched from airfields in Südwestafrika, the German Luftwaffe regularly launch missions across western Africa, indiscriminately bombing both civilian and military targets as a demented form of 'pilot training'. Only along the coast do those few scattered cities with sufficient anti-air capabilities keep the Luftwaffe at bay, with none in the region capable of beating back this enemy permanently. This leaves the Germans with near impunity to strike the towns and farmlands further inland, crippling western African growth until this nightmare can finally end."

 je_kill_yourba: "Crushing The Western Rebellion"
 je_kill_yourba_reason: "Opportunistic officers revolted during our invasion of Zentralafrika. We were not able to put the rebbellion down due to the war. The bombing has futher slowed down our recapture of these lands."
 je_kill_germany_africa: "Ending German Africa"
 je_kill_germany_africa_reason: "The time has come to end colonial rule in Africa, starting with Germany."
 je_reforming_aca: "Reforming the ACA"
 je_reforming_aca_reason: "The ACA's shining moments were during the Zentralafrika Crisis back in the 1950s, when it proved itself a powerful fighting force. Those glory days are gone, and the army is now a heap of different militias, disorderly command, and obsolete equipment, bound together by an ineffective command structure. The army is clearly overstretched and aging rapidly, falling into irrelevance amongst the colonial forces in the region."
 je_sokoto_colapse: "Looming Colapse"
 je_sokoto_colapse_reason: "German bombing runs has had an espciaespecially destabilizing effect on Sokoto. Local warlords already defacto control much of the country. The colapse of central authority cannot be stoped. There is nothing we can do but prepare for the worst."
 je_sokoto_colapse_goal: "Sokoto has colasped"