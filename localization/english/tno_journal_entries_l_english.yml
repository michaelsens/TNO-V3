  je_ru_tno_launch_raid: "The Second Smuta"
  je_ru_tno_launch_raid_reason: "In the harsh and brutal lands of Russia, many of the warlord states have resorted to... alternate means of developing their statelets.\n\nThrough methods that wouldn't work in more formal, civilized states, the warlord states must wield political clout in the correct manner, to ensure that their small realms are capable of defeating their foes in the future.\n\n\n- We are now able to partake in #negative_value;TOOLTIP: raids#! of our neighbors, granting us a #positive_value;TOOLTIP: percentage of their income#! for one year."
  je_ru_launch_raid: "Launch Raid"
  je_ru_launch_raid_desc: "Raiding is sadly a part of daily life in Russia, and as much as we hate to admit it, it's one of our few means of survival.  As such we must be ready to organize raids into neighboring territories to gather food, equipment and resources."
  je_ru_launch_raid_tt: "We will launch a #negative_value;TOOLTIP: raid#! against one of our neighboring Russian statelets."

  je_ru_tno_launch_attack: "The Second Time of Troubles"
  je_ru_tno_launch_attack_reason: "The end of the German bombing campaigns in Western Russia has created a window of opportunity for the Russian statelets to take action—many of our neighbors have already seized this chance.  If our state is to survive, much less reunite Russia, we must act decisively and swiftly.\n\nThe next chapter in Russian history will be marked with the blood of thousands.\n\n\n#white Our options for attack are limited by our current #bold Stage #!#white in the reunification process we are in, which is determined by the following:\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_1')] #gold Stage 1#! - Attack neighbors in the same region while at peace\n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_1')] One of the following must be true:\n        [SCOPE.GetRootScope.GetCountry.GetCustom('greater_than_date_1966')] The year is #bold 1966#! or greater.\n        [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_1_b')] All of the following must be true:\n                [SCOPE.GetRootScope.GetCountry.GetCustom('greater_than_date_1965_june')] The date is #bold June 1965#! or greater.\n                [SCOPE.GetRootScope.GetCountry.GetCustom('ru_is_siberian_far_eastern')] We are #bold Central Siberian#! or #bold Far Eastern#!.\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_2')] #gold Stage 2#! - Attack neighbors in the same region\n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_2')] The year is #bold 1971#! or greater.\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_3')] #gold Stage 3#! - Attack the neighboring region\n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_3')] One of the following must be true:\n        [SCOPE.GetRootScope.GetCountry.GetCustom('greater_than_date_1975')] The year is #bold 1975#! or greater.\n        [SCOPE.GetRootScope.GetCountry.GetCustom('ru_has_united_region')] We have unified our region of Russia.\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_4')] #gold Stage 4#! - No restrictions\n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_4')] The year is #bold 1980#! or greater."
  je_ru_launch_invasion: "Launch Invasion"
  je_ru_launch_invasion_desc: "We will launch an #white invasion#! of one of our neighbors, the details of which will be decided by an event.  Our options for attack are limited by which #white Stage#! in the reunification process we are in, which is determined by the following:#white \n\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_1')] #gold Stage 1#! - Attack neighbors in the same region while at peace\n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_1')] One of the following must be true:\n        [SCOPE.GetRootScope.GetCountry.GetCustom('greater_than_date_1966')] The year is #bold 1966#! or greater.\n        [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_1_b')] All of the following must be true:\n                [SCOPE.GetRootScope.GetCountry.GetCustom('greater_than_date_1965_june')] The date is #bold June 1965#! or greater.\n                [SCOPE.GetRootScope.GetCountry.GetCustom('ru_is_siberian_far_eastern')] We are #bold Central Siberian#! or #bold Far Eastern#!.\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_2')] #gold Stage 2#! - Attack neighbors in the same region\n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_2')] The year is #bold 1971#! or greater.\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_3')] #gold Stage 3#! - Attack the neighboring region\n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_3')] One of the following must be true:\n        [SCOPE.GetRootScope.GetCountry.GetCustom('greater_than_date_1975')] The year is #bold 1975#! or greater.\n        [SCOPE.GetRootScope.GetCountry.GetCustom('ru_has_united_region')] We have unified our region of Russia.\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_4')] #gold Stage 4#! - No restrictions\n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_reunification_stage_4')] The year is #bold 1980#! or greater."
  je_ru_launch_invasion_tt: "We will recieve an event that will allow us to choose our next target for invasion."


  je_ru_tno_irk_restore_order_far_east: "Restore Order in the Far East"
  je_ru_tno_irk_restore_order_far_east_reason: "The lands that our Union once held dominion over have been long lost against the tides of warlordism.  Sparked by our struggle with the Central Siberian traitors, the institutions and bountiful protection that the peoples of the Far East once enjoyed have all but collapsed.\n\nFascists, Tsarists, and opportunists alike have taken malevolent advantage of the Russian people through the collapse of our authority.  It will be our first priority to re-establish our presence in the Far East, to begin the reclamation of the rest of Russia.\n\n\nWe will be able to declare war on the warlords in our region on #!1st June 1965.#!"

  je_ru_irk_restore_far_east: "Restore the Far-Eastern Republic"
  je_ru_irk_restore_far_east_desc: "The time has finally come to proclaim the restoration of our rule over the Far East.  The peoples of these lands will surely join in celebration upon hearing our announcement."
  je_ru_irk_restore_far_east_tt_1: "We will #value;TOOLTIP: reclaim our authority#! in the Far-East, establishing ourselves as a capable #positive_value;TOOLTIP: regional power#! in Russia."
  je_ru_unite_far_east_tt_1: "We will #value;TOOLTIP: expand our authority#! in the Far-East, establishing ourselves as a capable #positive_value;TOOLTIP: regional power#! in Russia."
  #je_ru_irk_restore_far_east_tt_3: "All states in the Far East will gain [concept_incorporated_state]"
  je_ru_irk_restore_far_east_tt_4: "[SCOPE.GetRootScope.GetCountry.GetName] will become the #value;TOOLTIP: Far Eastern Soviet Socialist Republic#!"
  je_ru_irk_restore_far_east_tt_5: "We will be able to launch the #value;TOOLTIP: Sakha Expedition,#! yielding us a #positive_value;TOOLTIP: host of resources#! in the region of Chernyshevsky."
  recently_raided: "Recently Raided"
  recently_looted_neighbor: "Recently Looted Neighbor"

  je_ru_tno_unite_far_east: "Unite the Far East"
  je_ru_tno_unite_far_east_reason: "For far too long the Far-Eastern regions of Russia have been left to the devastation of warlordism.  We must secure order in our region of Russia, before we can move to reunite the entire nation.\n\n\nWe will be able to declare war on the warlords in our region on #!1st June 1965.#!"
  je_ru_unite_far_east: "Reunite the Far East"
  je_ru_unite_far_east_desc: "The time has finally come to proclaim the expansion of our rule over the entire Far East, an important milestone in the total reunification of Russia."
  je_ru_tno_unite_central_sib: "Unite Central Siberia"
  je_ru_tno_unite_central_sib_reason: "For far too long the Central Siberian region of Russia have been left to the devastation of warlordism.  We must secure order in our region of Russia, before we can move to reunite the entire nation.\n\n\nWe will be able to declare war on the warlords in our region on #!1st June 1965.#!"
  je_ru_unite_central_sib: "Reunite Central Siberia"
  je_ru_unite_central_sib_desc: "The time has finally come to proclaim the expansion of our rule over the entire Central Siberian region, an important milestone in the total reunification of Russia."
  je_ru_unite_central_sib_tt_1: "We will #value;TOOLTIP: expand our authority#! in Central Siberia, establishing ourselves as a capable #positive_value;TOOLTIP: regional power#! in Russia."
  je_ru_tno_unite_west_sib: "Unite West Siberia"
  je_ru_tno_unite_west_sib_reason: "For far too long the West Siberian region of Russia have been left to the devastation of warlordism.  We must secure order in our region of Russia, before we can move to reunite the entire nation.\n\n\nWe will be able to declare war on the warlords in our region on #!1st January 1966.#!"
  je_ru_unite_west_sib: "Reunite West Siberia"
  je_ru_unite_west_sib_desc: "The time has finally come to proclaim the expansion of our rule over the entire West Siberian region, an important milestone in the total reunification of Russia."
  je_ru_unite_west_sib_tt_1: "We will #value;TOOLTIP: expand our authority#! in West Siberia, establishing ourselves as a capable #positive_value;TOOLTIP: regional power#! in Russia."
  je_ru_tno_unite_west_russia: "Unite West Russia"
  je_ru_tno_unite_west_russia_reason: "For far too long has West Russia has been left to the devastation of warlordism.  We must secure order in our region of Russia, before we can move to reunite the entire nation.\n\n\nWe will be able to declare war on the warlords in our region on #!1st January 1966.#!"
  je_ru_unite_west_russia: "Reunite West Russia"
  je_ru_unite_west_russia_desc: "The time has finally come to proclaim the expansion of our rule over the entire West Russsian region, an important milestone in the total reunification of Russia."
  je_ru_unite_west_russia_tt_1: "We will #value;TOOLTIP: expand our authority#! in West Russia, establishing ourselves as a capable #positive_value;TOOLTIP: regional power#! in Russia."

