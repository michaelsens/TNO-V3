  je_ru_tno_irk_paris_of_siberia: "The Paris of Siberia"
  je_ru_tno_irk_paris_of_siberia_reason: "The recent #positive_value;TOOLTIP: expansion and overhaul#! of the #value;TOOLTIP: Trans-Siberian Railway#! has created a new wealth of #value;TOOLTIP: immigration#! and #value;TOOLTIP: interconnectivity#! to our region of Russia, which has created an atmosphere of unforseen economic potential within Irkutsk.  Although not officially a part of the original #value;TOOLTIP: Siberian Plan,#! [SCOPE.sCharacter('irkutsk_leader').GetFullName] has envisioned a large-scale industrial and housing development scheme, intended to provide new #positive_value;TOOLTIP: economic opportunities#! for the influx of immigrants to Irkutsk.\n\n[SCOPE.sCharacter('irkutsk_leader').GetFullName] aims for [SCOPE.sCharacter('irkutsk_leader').GetHerHis] contemporary economic scheme to complement the completion of the #value;TOOLTIP: Siberian Plan.#!  These exploits can also result in #positive_value;TOOLTIP: additional bonuses,#! should we build a certain amount of [SelectLocalization(GetPlayer.IsValid, 'concept_tax_capacity_desc_added','Government Administration')] buildings in Irkutsk."
  je_paris_of_siberia_rq: "[SCOPE.sState('irkutsk_state_scope').GetName]:\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_irk_paris_of_siberia_university')] Has at least 2 of [GetBuildingType('building_university').GetName] building\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_irk_paris_of_siberia_decree')] Has the [GetDecreeType('decree_encourage_manufacturing_industry').GetName] [concept_decree]\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_irk_paris_of_siberia_urbanization')] [GetBuildingType('building_urban_center').GetName] [concept_building_level] is at least #T 10#!\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('ru_irk_paris_of_siberia_repair_bonus')] Additionally, if we have at least 4 of [GetBuildingType('building_government_administration').GetName] in [SCOPE.sState('irkutsk_state_scope').GetName]:\n[SCOPE.GetRootScope.GetCountry.GetName] gains #value;TOOLTIP: The Irkutsk Model#! which grants:\n#positive_value;TOOLTIP: +20.0%#! [GetBuildingType('building_government_administration').GetName] building [concept_throughput] \n\n#value;TOOLTIP: The Irkutsk Model#! lasts #value;TOOLTIP: permanently#!"
  je_paris_of_siberia_complete: "[SCOPE.sState('irkutsk_state_scope').GetName] recieves the [concept_state] Trait #value;TOOLTIP: The Paris of Siberia#!, granting:\n#G +2.0#! [concept_sol]\n#G +15.0%#! #T State Construction Efficiency#!\n#G +20%#! [concept_education_access]\n#G +10%#! #T Qualifications#!"
  je_paris_of_siberia_complete_extra: "Because we have 4 of [GetBuildingType('building_government_administration').GetName] in [SCOPE.sState('irkutsk_state_scope').GetName]:\n[SCOPE.GetRootScope.GetCountry.GetName] gains #value;TOOLTIP: The Irkutsk Model#! which grants:\n#positive_value;TOOLTIP: +20.0%#! [GetBuildingType('building_government_administration').GetName] building [concept_throughput] \n\n#value;TOOLTIP: The Irkutsk Model#! lasts #value;TOOLTIP: permanently#!"

  je_ru_tno_irk_finish_sib_plan: "The Siberian Plan"
  je_ru_tno_irk_finish_sib_plan_reason: "While the majority of #G industrial growth#! outlined in Bukharin's original #T Siberian Plan#! was concentrated in Western Siberia, the Far East was not left without a lingering fallout of the old economic projects.   Regrettably, the full execution of Bukharin's vision was thwarted by the outbreak of the #R Great Patriotic War#!, leaving the project incomplete to this day.\n\nGiven that we now possess the economic prowess to launch large-scale economic incentives, it is finally time to finish the plan once and for all, albeit with some necessary refinements to shape it up to the #T modern era#!."
  je_ru_gen_complete_sib_plan: "Complete the Siberian Plan"
  je_ru_gen_complete_sib_plan_desc: "Our ancestors before the war could have only dreamed of what glorious economic might the Far East will soon have.  Soon, with great dilligence and patience, the Far East will become a more than capable staging ground for orchestrating the reunification of the rest of Russia."
  fin_sib_sakha_done: "Has finished the #T Sakha Expedition#!"
  fin_sib_transsib_done: "Has finished repairs on the #T Trans-Siberian Railway#!"
  fin_sib_paris_of_siberia_done: "Has finished the #T Paris of Siberia#! [concept_journal_entry]"
  fin_sib_usa_relations: "Relations between [SCOPE.GetRootScope.GetCountry.GetName] and [SCOPE.sCountry('usa_nation_scope').GetName] are at least #G Cordial"
  sib_plan_complete: "Every [concept_state] in the #T Far East#! gains #value;TOOLTIP: The Siberian Plan#! which grants:\n#positive_value;TOOLTIP: +15.0%#! [concept_infrastructure]\n#positive_value;TOOLTIP: -5%#! [Concept('concept_pop_growth','$concept_pop_growth_mortality$')]\n#positive_value;TOOLTIP: +10%#! [Concept('concept_loyalist', '$concept_loyalists$')] from [concept_sol] increases\n\n#value;TOOLTIP: The Siberian Plan#! lasts #value;TOOLTIP: permanently#!"
  sib_plan_complete_2: "[SCOPE.GetRootScope.GetCountry.GetName] enacts [GetLawType('law_socialist_market_economy').GetName] which grants:\n#negative_value;TOOLTIP: -10% #!@aut! [concept_authority]\n#value;TOOLTIP: +35.0%#! [Concept('concept_private_construction', 'Private Construction Allocation')]\n#positive_value;TOOLTIP: -25%#! [Concept('concept_budget_interest', 'Loan interest rate')]\n#positive_value;TOOLTIP: +5.0%#! [Concept('concept_construction', 'State Construction Efficiency')]\n#positive_value;TOOLTIP: +10%#! [Concept('concept_loyalist', '$concept_loyalists$')] from [concept_sol] increases\n#positive_value;TOOLTIP: Yes#! [Concept('concept_subsidies', 'Can Subsidize all Buildings')]\n#value;TOOLTIP: +45%#! [concept_political_strength] [Concept('concept_subsidies', 'of @capitalists! Capitalists')]\n#positive_value;TOOLTIP: +35%#! [Concept('concept_investment_pool', ' @capitalists! Capitalists')] Investment Pool [Concept('concept_investment_pool', 'contribution efficiency')]"
  sib_plan_complete_3: "We can now use the #value;TOOLTIP: Special Economic Zone#! [concept_decree]:\n#T Cost: @aut! 200#! [concept_authority]#!\n#positive_value;TOOLTIP: +15.0%#! [Concept('concept_construction', 'State Construction Efficiency')]\n#positive_value;TOOLTIP: +10%#! [concept_pop_qualifications]\n#positive_value;TOOLTIP: +20.0%#! Manufacturing Industries [concept_throughput]\n#positive_value;TOOLTIP: +20.0%#! Service Industries [concept_throughput]\n#positive_value;TOOLTIP: +20.0%#! Mines [concept_throughput]\n#positive_value;TOOLTIP: +20.0%#! Logging Industries [concept_throughput]\n\nThis [concept_decree] can be enacted as long as we have the law [GetLawType('law_socialist_market_economy').GetName]"

  je_ru_tno_com_restore_ussr: "Restore the Soviet Union"
  je_ru_tno_com_restore_ussr_reason: "After the #R Fascist Invader#! destroyed our homeland through their savage campaign of pillaging and destruction, the Motherland has fallen into #R anarchy and disunity#!.  Time and time again throughout Russian history, Russians have best defended themselves from external threats when united under one strong, central government.\n\nWith our circumstances now ameliorated, the time has come to mend the fractures and restore unity to the Motherland under its sole legitimate authority: #R The Soviet Union#!.  The #R Red Banner#!, though battered and bruised, will once more rise from the ashes that was the #R Great Patriotic War#! into a thriving superpower."
  je_ru_com_restore_ussr: "Restore the USSR"
  je_ru_com_restore_ussr_desc: "The peoples of Russia and beyond have finally been reunited under our bountiful protection.  It is time to begin the process of preparing for the greatest challenge our nation has faced yet: #R The Second Great Patriotic War#!."
  je_ru_com_restore_ussr_desc_tt_1: "[SCOPE.GetRootScope.GetCountry.GetName] becomes the #T Union of Soviet Socialist Republics"
  je_ru_restore_russia_tt_reclaim_position: "We will #value;TOOLTIP: reclaim our position#! in the World, establishing ourselves as the #positive_value;TOOLTIP: rightful ruler#! of Russia."
  je_ru_com_restore_ussr_desc_tt_3: "[SCOPE.GetRootScope.GetCountry.GetName] and [SCOPE.sCountry('ger_nation_scope').GetName] will enter into a mutual [concept_rivalry]"
  formed_russia_rq_tt: "Has reunited #bold Russia#!"

  je_ru_tno_restore_russia: "Restore Russia"
  je_ru_tno_restore_russia_reason: "Russia is the distant memory that our people have long wished had never been lost—a memory of a bygone era free from the shackles of warlordism, constant conflict, and enduring suffering.\n\nFortunately, we now have the serious capability to defeat the other warlord states, paving the way to restore order to these lands.  What will emerge from the results of our struggles will be a new Russian State - founded upon the core values which we live and die for."
  je_ru_restore_russia: "Restore Russia"
  je_ru_restore_russia_desc: "The peoples of Russia and beyond have finally been reunited under our bountiful protection.  It is time to begin the process of preparing for the greatest challenge our nation has faced yet: #R the reclamation of our Western territories#!."

  je_ru_take_karelia: "Take Karelia"
  je_ru_take_karelia_reason: "The unequivocal reality is that #T East Karelia#! rightfully belongs to the Russian State. This assertion is grounded not only in historical context but also in the fact that the vast majority of the territory is Russian-speaking. It is now our inherent responsibility to safeguard the well-being of our fellow Russian citizens who find themselves living under what is nothing more than the #R oppressive#! rule of Finland, where their #T culture and livelihoods#! are #R at stake of being destroyed.#!\n\nThese individuals deserve the #G bountiful protection#! that our rule already offers to so many Russians.  The Russian speakers should #T rejoin their brethren#! as the next step in the #T reunification of Russia#!."
  je_ru_take_karelia_and_onega: "Take Karelia"
  je_ru_take_karelia_and_onega_reason: "The unequivocal reality is that #T East Karelia#! rightfully belongs to the Russian State. This assertion is grounded not only in historical context but also in the fact that the vast majority of the territory is Russian-speaking. It is now our inherent responsibility to safeguard the well-being of our fellow Russian citizens who find themselves living under what is nothing more than the #R oppressive#! rule of Finland, where their #T culture and livelihoods#! are #R at stake of being destroyed.#!\n\nThese individuals deserve the #G bountiful protection#! that our rule already offers to so many Russians.  The Russian speakers should #T rejoin their brethren#! as the next step in the #T reunification of Russia#!."
  je_ru_take_karelia_button: "Invade Karelia"
  je_ru_take_karelia_button_desc: "The time is finally here to reclaim our lost territory.  This will be the first of many mistakes we will resolve from our defeat in the #R Great Patriotic War#!."
  je_ru_take_karelia_button_tt: "Other nations will #R not#! be able to join this [concept_diplomatic_play]\n#lore The war will start almost immediately, so be prepared.#!"

  je_ru_repair_magadan: "Repair the Port of Magadan"
  je_ru_repair_magadan_reason: "In the course of the #R Great Patriotic War,#! our predecessors harnessed the once illustrious #T Vladivostok port#!, in tandem with the #T Trans-Siberian Railway#!, to channel #G American aid#! to the frontlines in the desperate #R struggle#! against the #R German enemy#!.\n\nHowever, the #R loss#! of Vladivostok and Outer Manchuria itself has almost #R severed our influence#! in the Pacific Ocean, and with the Arkhangelsk port under threat of blockade, we have no means of recieving support from the OFN.  It is therefore imperative that we allocate the neccessary #T time and investment#! to expand the capacity of the Magadan port, transforming it into a #G renewed and modernized facility#! for international trade and power projection."
  je_repair_magadan_tt: "[SCOPE.sState('okhotsk_state_scope').GetName]: \n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_repair_magadan_railway')] Has 3 or more [concept_building_level] of [GetBuildingType('building_railway').GetName]\n    [SCOPE.GetRootScope.GetCountry.GetCustom('ru_repair_magadan_port')] Has at least 1 [concept_building_level] of [GetBuildingType('building_port').GetName]"
  je_repair_magadan_complete_tt: "We will be able to #G request aid#! from the #blue Americans,#! yielding us specific #G bonuses#!."

  je_ru_buy_supplies_usa: "Our American Allies"
  je_ru_buy_supplies_usa_reason: "In the aftermath of our eventual #G reunification#! of Russia, our alliance with the #blue Organization of Free Nations#! has faced occasional challenges. However, our leaders maintain confidence that our #R shared adversary#! against Germany will sustain our necessary bond.\n\n#G Fortunately#!, the Americans' hesitance to deploy their own forces against the relentless #R Fascist threat#! provides us with a unique #T negotiation leverage#! – our commitment to #R total war#! against #R Germany#!. We firmly believe that the foundation of our campaign against the Germans will undermine their strength and potentially precipitate the #T collapse of their Empire#! – sparing American lives from the daunting prospect of an invasion of Western Europe.\n\nWe anticipate that this motivation will #T inspire#! the Americans to lend #G crucial military support#!, enabling us to prosecute our own war against Germany in the #T mutual interest#! of both our nations and the #blue Organization of Free Nations#!."
  je_ru_request_american_support: "Contact the Americans"
  je_ru_request_american_support_desc: "We will request that the Americans offer us a helping hand, in the name of our shared interest in the defeat of Germany.  Should the Americans accept, they will become involved in our war when it begins.\n\nOf course, being Americans, their involvement with the war will not be total.  When the war begins, America will have the choice to become a mediator in our conflict, capable of demanding concessions from Germany to prevent nuclear war."
  cooldown_request_american_aid: "Has not requested [SCOPE.sCountry('usa_nation_scope').GetAdjective] aid in the past"
  complete_request_american_aid: "Has requested [SCOPE.sCountry('usa_nation_scope').GetAdjective] aid"
  complete_request_american_aid_and_magadan: "Has #T repaired the port of Magadan#! and #T requested [SCOPE.sCountry('usa_nation_scope').GetAdjective] aid#!"

  je_ru_tno_army_reform: "Army Reforms"
  je_ru_tno_army_reform_reason: "Although our military has been given #T ample priority#! over other matters while we were under the process of reunification, the army reflects the basis on which it was formed: #R impromptu.#!  The Armed Forces find themselves #R entrenched in a bygone era,#! a time characterized by using #R whatever we could get our hands on.#!\n\nRegrettably, this lack of experience using modern equipment requires us to #R completely reform the Army from the ground up,#! as our latest tactics development dates to the 1940s.\n\n#T Effects from current Army Reform level:#!\n[ROOT.GetCountry.GetCustom('army_reform_current')]"
  je_ru_tno_army_reform_basic: "Army Reforms"
  je_ru_tno_army_reform_basic_reason: "Although our military has been given #T ample priority#! over other matters while we were under the process of reunification, the army reflects the basis on which it was formed: #R impromptu.#!  The Armed Forces find themselves #R entrenched in a bygone era,#! a time characterized by using #R whatever we could get our hands on.#!\n\nRegrettably, this lack of experience using modern equipment requires us to #R completely reform the Army from the ground up,#! as our latest tactics development dates to the 1940s.\n\n#T Effects from current Army Reform level:#!\n[ROOT.GetCountry.GetCustom('army_reform_current')]"
  je_ru_tno_army_reform_significant: "Army Reforms"
  je_ru_tno_army_reform_significant_reason: "Although our military has been given #T ample priority#! over other matters while we were under the process of reunification, the army reflects the basis on which it was formed: #R impromptu.#!  The Armed Forces find themselves #R entrenched in a bygone era,#! a time characterized by using #R whatever we could get our hands on.#!\n\nRegrettably, this lack of experience using modern equipment requires us to #R completely reform the Army from the ground up,#! as our latest tactics development dates to the 1940s.\n\n#T Effects from current Army Reform level:#!\n[ROOT.GetCountry.GetCustom('army_reform_current')]"
  je_ru_tno_army_reform_full: "Army Reforms"
  je_ru_tno_army_reform_full_reason: "Although our military has been given #T ample priority#! over other matters while we were under the process of reunification, the army reflects the basis on which it was formed: #R impromptu.#!  The Armed Forces find themselves #R entrenched in a bygone era,#! a time characterized by using #R whatever we could get our hands on.#!\n\nRegrettably, this lack of experience using modern equipment requires us to #R completely reform the Army from the ground up,#! as our latest tactics development dates to the 1940s.\n\n#T Effects from current Army Reform level:#!\n[ROOT.GetCountry.GetCustom('army_reform_current')]"
  ru_army_reform_rq_tt: "#bold Please allow for one month tick for requirement fufillment to update.#!\n[SCOPE.GetRootScope.GetCountry.GetCustom('army_reform_rq')]"
  ru_army_reform_completion_tt: "[SCOPE.GetRootScope.GetCountry.GetCustom('army_reform_completion')]"
  ru_army_reform_current_tt: "[SCOPE.GetRootScope.GetCountry.GetCustom('army_reform_current')]"
  je_ru_gen_reform_army_advance: "Advance Army Reforms"
  je_ru_gen_reform_army_advance_first_desc: "Every minute that our army stands in its' current state is another minute that the Germans could use to invade us.  We should prevent a pre-emptive German invasion by a complete and thorough set of Army Reforms, transforming our army into a more than capable fighting force."
  je_ru_gen_reform_army_advance_desc: "After a significant capital and time investment, our armed forces have now finished a significant part of their reforms.  It is time to begin the next phase of Army Reform, until our army is finally a fully modernized fighting force."
  complete_one_army_reform_rq: "Has completed at least one #T Army Reform#!"
  ru_army_reform_rq: "View the requirements for each #T Army Reform#! in the button above."

  je_ru_tno_partisan: "Russian Partisans"
  je_ru_tno_partisan_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('partisan_level_complete')] okay"

  je_ru_tno_partisan_complete: "[SCOPE.GetRootScope.GetCountry.GetCustom('partisan_level_complete')]"

  je_ru_tno_second_great_patriotic_war: "The Second Great Patriotic War"
  je_ru_tno_second_great_patriotic_war_reason: "At last, #R Russia#! has been united.  Unfortunately, millions of Russians and our glorious capital of #T Moskva#! now #R lie under the yoke of Germany.#!  The moment has arrived to execute our #R ultimate retaliation#!: eradicating the #R Fascist invader#! once and for all.\n\nThis incredible undertaking will only be possible by the #T desperate labor#! that our nation has endured to prepare itself for the coming struggle.  This war will come to define our history; it is #R all-in or nothing.#!  May God forgive us if we fail, for the only concievable result is total thermonuclear annihilation."
  je_ru_second_great_patriotic_war: "Launch the War"
  je_ru_second_great_patriotic_war_desc: "The time has finally arrived.  #R The Second Great Patriotic War,#! the project which our leaders have cultivated for so long, is now upon us."

  je_ru_tno_second_west_russian_war: "[SCOPE.GetRootScope.GetCountry.GetCustom('je_ru_tno_second_west_russian_war_title')]"
  je_ru_tno_second_west_russian_war_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('je_ru_tno_second_west_russian_war_reason')]"
  je_ru_pro_second_west_russian_war: "[SCOPE.GetRootScope.GetCountry.GetCustom('je_ru_tno_second_west_russian_war_title')]"
