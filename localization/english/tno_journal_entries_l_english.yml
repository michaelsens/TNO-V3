 je_Sphere_lucknow_conference: "The Lucknow Conference"
 je_Sphere_lucknow_conference_reason: "custom" #My nifty way of removing gui elements
 cgui_lucknow_reason: "#blue #bold              THE SOUTH ASIAN ECONOMIC CONFERENCE#!\n#white The South Asian Economic Conference, known as the #bold Lucknow Conference#!#white , is our final opportunity of mending relations between the two Indias.  If the conference succeeds, both Indias will be pledged to a single market, perhaps #bold the first step towards the total reunification of India.#!\n\n#red If the conference fails, India may never be united peacefully.#!"
 cgui_lucknow_tension_hack: "                                                                                                                                                                                                                                                                                                                                                                     "
