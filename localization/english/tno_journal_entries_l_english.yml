  je_ru_second_west_russian_war: "Launch the War"
  je_ru_second_west_russian_war_desc: "The preparations are complete, our armies stand at the ready.  #white [SCOPE.GetRootScope.GetCountry.GetCustom('je_ru_tno_second_west_russian_war_title')],#! the project which our predecessors have tried and failed multiple times must now culminate at this moment, where we will finally launch our devastating blow against the Germans, liberating our Russian compatriots from German oppression."

