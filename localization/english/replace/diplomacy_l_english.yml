  governorate_proposal_break_accepted_desc: "Independence gained"
  governorate_proposal_break_declined_name: "Independence denied"
  governorate_proposal_break_declined_desc: "Independence denied"
  governorate_proposal_notification_break_effects_desc: "Antonescu's grand conquest, the Holy Grail received as a reward from Romania's World War Two adventures is, in reality, a poisoned chalice. The Transnistrian territory is bound to the Tighina Accords, an agreement that currently sees Romania pour money and military into it for paltry benefits and little ability to change the status quo. This has led to ire towards the Bucharest government from the settler population of Dniester Hills for their inaction and inability to deal with any of these issues. And now they ask to be free."
  governorate_action_break_name: "Release Governorate"
  governorate_action_ask_to_break_name: "Ask for independence"
  governorate_proposal_notification_break_name: "Transnistria asks for independence"
  governorate_proposal_notification_break_name_desc: "Transnistria is asking for independence"
  
  # Special Relationship
  iceland_gov: "Special Relationship"
  iceland_gov_action_ask_to_break_name: "Ask for independence"
  iceland_gov_proposal_notification_break_name: "Iceland seeks independence "
  iceland_gov_proposal_notification_break_desc: "The Republic of Iceland and the United States of America have a special relationship, though what is meant by 'special' depends on who has been asked.\n\nTo some people, Iceland-US relations are special in a good way. These point at the defense of Iceland's interests, which the United States often take upon themselves to defend, economic benefits in the capital due to the presence of soldiers, and the preservation of stability provided by allied troops.\n\nTo others, the relationship is special in a uniquely bad way. They complain that the country has effectively been occupied by OFN forces, and that local Icelanders are unable to use and benefit from large parts of their country due to military appropriations. To some particularly hyperbolic people, the boots on the ground might as well be Nazi jackboots with how omnipresent and out-of-touch they are.\n\nRegardless of one's own convictions, the relationship is and remains special—but which way it will go, is America's and Iceland's to determine."

  iceland_gov_proposal_notification_break_effects_desc: "Iceland will leave the OFN"

  iceland_gov_desc: "The Republic of Iceland and the United States of America have a special relationship, though what is meant by 'special' depends on who has been asked.\n\nTo some people, Iceland-US relations are special in a good way. These point at the defense of Iceland's interests, which the United States often take upon themselves to defend, economic benefits in the capital due to the presence of soldiers, and the preservation of stability provided by allied troops.\n\nTo others, the relationship is special in a uniquely bad way. They complain that the country has effectively been occupied by OFN forces, and that local Icelanders are unable to use and benefit from large parts of their country due to military appropriations. To some particularly hyperbolic people, the boots on the ground might as well be Nazi jackboots with how omnipresent and out-of-touch they are.\n\nRegardless of one's own convictions, the relationship is and remains special—but which way it will go, is America's and Iceland's to determine"

