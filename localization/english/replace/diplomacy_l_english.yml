  iceland_gov_action_propose_name: "The Republic of Iceland and the United States of America have a special relationship, though what is meant by 'special' depends on who has been asked.\n\nTo some people, Iceland-US relations are special in a good way. These point at the defense of Iceland's interests, which the United States often take upon themselves to defend, economic benefits in the capital due to the presence of soldiers, and the preservation of stability provided by allied troops.\n\nTo others, the relationship is special in a uniquely bad way. They complain that the country has effectively been occupied by OFN forces, and that local Icelanders are unable to use and benefit from large parts of their country due to military appropriations. To some particularly hyperbolic people, the boots on the ground might as well be Nazi jackboots with how omnipresent and out-of-touch they are.\n\nRegardless of one's own convictions, the relationship is and remains special—but which way it will go, is America's and Iceland's to determine."
