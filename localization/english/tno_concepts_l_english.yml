#this pattern of checking if the player is valid avoids crashing if opening the Vickypedia in the Main Menu

concept_reichskommissariat: "Reichskommissariat"
concept_reichskommissariat_desc: "[Concept('concept_reichskommissariat','Reichskommissariats')] are special [Concept('concept_subject_type','Subject Types')] available to Germany at the start of the game.  [Concept('concept_reichskommissariat','Reichskommissariats')] are similar to [Concept('concept_puppet','Puppets')] but provide less income and convoys.  If a [concept_reichskommissariat] stops being a [concept_subject] of Germany, they might be reclaimed via a special [concept_journal_entry]."
concept_rk_desc: "#gold Lesser Administrations #!are special administrative regions that are formally part of the Reich but exercise some form of autonomy from the #white Central Government.#!  These administrations often maintain their own laws and policies, but are ultimately guided and overseen by the Central Government in Berlin.\n\nThere are a total of #v 1#! different #gold Lesser Administrations#!:\n@reichskommissariat! [concept_reichskommissariat]"

concept_governorate: "Governorate"
concept_governorate_desc: "The [concept_governorate] is a special [concept_subject_type] that represents the Romanian and German administration over the region of #white Transnistria.#!  [Concept('concept_governorate','Governorates')] are similar to [Concept('concept_puppet','Puppets')] but provide less income."

#[Concept('concept_recognized_power','$concept_recognized_powers$')] may turn a weaker [concept_country] into their $concept_puppet$ ([concept_subject]). A $concept_puppet$ is a [concept_subject_type] that cannot start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] yet are forced to join their [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_war','$concept_wars$')], and must also pay #v 30%#! of their [concept_treasury] income to their $concept_overlord$ each week. A $concept_puppet$'s [concept_rank] cannot increase to match or exceed their $concept_overlord$'s, and their $concept_overlord$ may target them with the #b Annexation#! $concept_diplomatic_play$.